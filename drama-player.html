<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Story.fun</title>
<link rel="stylesheet" href="cm-panel.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1825;
  --accent:#000000;
  --accent-soft:rgba(0, 0, 0,0.12);
  --surface:#141f33;
  --text:#e8edf5;
  --text-muted:#8896a8;
  --border:#1e2d42;
  font-family:"PingFang SC","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);-webkit-tap-highlight-color:transparent;user-select:none}

/* ===== 首页模式 ===== */
.home-app{position:fixed;inset:0;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}

/* Feed 模式 */
.feed-app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#feedTrack{position:absolute;left:0;top:0;width:100%;will-change:transform}
.feed-slide{position:absolute;left:0;width:100%;height:100vh;overflow:hidden}
.feed-slide .slide-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.feed-slide .slide-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#000}
.feed-slide .slide-mask{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,24,37,0.08),rgba(15,24,37,0.02) 35%,rgba(15,24,37,0.45) 70%,rgba(15,24,37,0.78));pointer-events:none}

/* Feed 顶部栏 */
.feed-top{position:fixed;top:0;left:0;right:0;z-index:10;height:56px;padding-top:env(safe-area-inset-top,0);display:flex;align-items:center;justify-content:space-between;padding:0 16px;pointer-events:none}
.feed-top .feed-logo{font-size:17px;font-weight:700;color:#ff3b30;letter-spacing:-0.3px}
.feed-top .feed-switch{pointer-events:auto;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:.5px solid rgba(255,255,255,.15);color:#fff;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s}
.feed-top .feed-switch:active{background:rgba(255,255,255,.25)}

/* Feed 信息区 */
.feed-info{position:absolute;left:18px;right:80px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:2;display:flex;flex-direction:column;gap:8px}
.feed-info .fi-title{font-size:20px;font-weight:700;color:#fff;line-height:1.25;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.feed-info .fi-desc{font-size:12px;color:rgba(255,255,255,.55);line-height:1.55;max-height:34px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}


/* Feed 右侧操作 */
.feed-actions{position:absolute;right:10px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px}
.feed-act-btn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border:none;background:none;padding:0;color:#fff;-webkit-tap-highlight-color:transparent;transition:transform .15s}
.feed-act-btn:active{transform:scale(.82)}
.feed-act-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:17px;transition:all .2s}
.feed-act-icon.liked{color:#fff;background:var(--accent)}
.feed-act-icon.bookmarked{color:#fff;background:#ffbb3a}
.feed-act-label{font-size:10px;font-weight:500;color:rgba(255,255,255,.7);line-height:1}

/* Feed 底部查看详情 */
.feed-bottom{position:fixed;left:0;right:0;bottom:0;z-index:11;padding:8px 16px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0));display:flex;justify-content:center;pointer-events:none}
.feed-bottom .fb-btn{pointer-events:auto;padding:12px 32px;border-radius:999px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s;box-shadow:0 4px 16px rgba(0, 0, 0,.35)}
.feed-bottom .fb-btn:active{transform:scale(.95);opacity:.85}

/* ===== 列表模式 ===== */
.list-app{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 60px}
.list-app::-webkit-scrollbar{width:0}

/* 列表顶部栏 */
.list-top{position:sticky;top:0;z-index:10;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0));display:flex;align-items:center;justify-content:space-between;background:var(--bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.list-top .list-logo{font-size:17px;font-weight:700;color:var(--text);letter-spacing:-0.3px}
.list-top .list-switch{padding:6px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all .2s}
.list-top .list-switch:active{opacity:.7}

/* Banner */
.list-banner{position:relative;margin:0 16px;height:240px;border-radius:16px;overflow:hidden}
.list-banner img{width:100%;height:100%;object-fit:cover;display:block}
.list-banner .banner-mask{position:absolute;inset:0;background:linear-gradient(0deg,rgba(15,24,37,.8),rgba(15,24,37,.1) 50%,transparent);pointer-events:none}
.list-banner .banner-info{position:absolute;left:20px;bottom:20px;right:80px;color:#fff}
.list-banner .banner-info h2{font-size:22px;font-weight:700;margin-bottom:4px}
.list-banner .banner-info span{font-size:12px;color:rgba(255,255,255,.6)}
.list-banner .banner-play{position:absolute;right:16px;bottom:16px;width:48px;height:48px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;box-shadow:0 4px 16px rgba(0, 0, 0,.45);transition:all .2s}
.list-banner .banner-play:active{transform:scale(.9)}
.list-banner .banner-play svg{width:22px;height:22px;fill:#fff;margin-left:2px}

/* 搜索 */
.list-search{padding:16px 16px 8px}
.list-search input{width:100%;padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.list-search input:focus{border-color:var(--accent)}
.list-search input::placeholder{color:var(--text-muted)}

/* 筛选 */
.list-filters{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.list-filters::-webkit-scrollbar{display:none}
.list-filters .filter-tag{padding:7px 14px;border-radius:999px;background:var(--surface);color:var(--text-muted);font-size:13px;white-space:nowrap;cursor:pointer;border:1px solid var(--border);transition:all .2s}
.list-filters .filter-tag.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 卡片网格 */
.list-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px 16px}
.list-card{border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s;background:var(--surface);box-shadow:0 2px 12px rgba(0,0,0,.15)}
.list-card:active{transform:scale(.97)}
.list-card .card-img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.list-card .card-body{padding:12px 14px}
.list-card .card-body h3{font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.3}
.list-card .card-body .card-tag{display:inline-block;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600}

/* ===== 播放器模式（原逻辑） ===== */
#playerApp{position:fixed;inset:0;overflow:hidden;background:var(--bg);display:none}
#playerApp.active{display:block}
#track{position:absolute;left:0;top:0;width:100%;will-change:transform}
.slide{position:absolute;left:0;width:100%;height:100vh;overflow:hidden}
.slide .slide-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.slide-mask{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,24,37,0.1),rgba(15,24,37,0.05) 30%,rgba(15,24,37,0.4) 70%,rgba(15,24,37,0.82));pointer-events:none}
.player-play-btn{position:absolute;top:50%;left:50%;z-index:3;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:.5px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.player-play-btn.show{opacity:1}
.player-play-btn svg{width:30px;height:30px;fill:#fff;margin-left:3px}

.top-back{position:fixed;top:0;left:0;right:0;z-index:10;height:56px;padding-top:env(safe-area-inset-top,0);display:flex;align-items:center;padding:0 12px;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent);pointer-events:none}
.top-back .back-btn{pointer-events:auto;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;flex-shrink:0;padding:8px}
.top-back .back-btn:active{opacity:.7}
.top-back .back-btn svg{width:28px;height:28px}
.top-back .ep-badge{pointer-events:auto;margin-left:12px;font-size:18px;font-weight:600;color:#fff;letter-spacing:.5px}

.player-bottom-bar{position:fixed;left:0;right:0;bottom:0;z-index:11;display:flex;align-items:center;gap:8px;padding:6px 10px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0));background:linear-gradient(0deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,.25) 80%,transparent);pointer-events:none}
.player-bottom-bar .bb-btn{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:.5px solid rgba(255,255,255,.15);color:#fff;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;border:none}
.player-bottom-bar .bb-btn:active{background:rgba(255,255,255,.25);transform:scale(.92)}
.player-bottom-bar .bb-btn svg{width:16px;height:16px;flex-shrink:0}
.player-bottom-bar .bb-btn.bb-ep{flex:1;gap:8px;padding:10px 20px}
.player-bottom-bar .bb-btn.bb-full{padding:10px 16px;flex-shrink:0;transition:all .2s}
.player-bottom-bar .bb-btn.bb-full.active{background:var(--accent);border-color:var(--accent)}
.player-bottom-bar .bb-btn.bb-full svg{width:18px;height:18px}

.player-actions{position:absolute;right:10px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:2;display:flex;flex-direction:column;align-items:center;gap:16px}
.player-act-btn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border:none;background:none;padding:0;color:#fff;-webkit-tap-highlight-color:transparent;transition:transform .15s}
.player-act-btn:active{transform:scale(.82)}
.player-act-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:none;font-size:18px;transition:all .2s}
.player-act-icon.liked{color:#ff4d6a}
.player-act-icon.bookmarked{color:#ffbb3a}
.player-act-label{font-size:10px;font-weight:500;color:rgba(255,255,255,.75);line-height:1}

.player-info{position:absolute;left:18px;right:80px;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:2;display:flex;flex-direction:column;gap:6px}
.player-info .pi-title{font-size:19px;font-weight:700;color:#fff;line-height:1.3;text-shadow:0 2px 12px rgba(0,0,0,.5);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.player-info .pi-title .pi-arrow{font-size:20px;color:rgba(255,255,255,.5);transition:transform .2s}
.player-info .pi-title:active .pi-arrow{transform:translateX(3px)}
.player-info .pi-desc{font-size:12px;color:rgba(255,255,255,.75);line-height:1.5;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.player-info .pi-desc .desc-text{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1;min-width:0;max-width:280px;color:rgba(255,255,255,.65)}
.pi-desc .desc-text.expanded{white-space:normal!important;overflow:visible!important}
.player-info .pi-desc .desc-expand{color:rgba(255,255,255,.85);font-weight:500;font-size:11px;cursor:pointer;flex-shrink:0;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.15);border:.5px solid rgba(255,255,255,.2);transition:background .15s}
.player-info .pi-desc .desc-expand:active{background:rgba(255,255,255,.25)}

.player-progress{position:fixed;left:0;right:0;bottom:48px;z-index:12;height:4px;background:rgba(255,255,255,.12);cursor:pointer;pointer-events:auto;touch-action:none}
.player-progress .pp-fill{height:100%;width:0%;background:linear-gradient(90deg,#000000,#666666);border-radius:0 2px 2px 0;position:relative;transition:none}
.player-progress .pp-fill .pp-thumb{position:absolute;right:-7px;top:50%;transform:translateY(-50%);width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #000000;box-shadow:0 1px 6px rgba(0,0,0,.4);opacity:0;transition:opacity .2s}
.player-progress:active .pp-fill .pp-thumb,.player-progress:hover .pp-fill .pp-thumb,.player-progress.show-thumb .pp-fill .pp-thumb{opacity:1}

.pp-tooltip{position:fixed;z-index:20;pointer-events:none;opacity:0;transition:opacity .15s;left:50%;transform:translateX(-50%);bottom:calc(50px + 4px + 24px)}
.pp-tooltip.show{opacity:1}
.pp-tooltip .pp-tip-img{width:86px;height:130px;border-radius:10px;object-fit:cover;display:block;box-shadow:0 4px 20px rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.2)}
.pp-tooltip .pp-tip-time{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);background:rgba(0,0,0,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;border:.5px solid rgba(255,255,255,.12)}

#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:99;transition:opacity .4s}
#loading.hide{opacity:0;pointer-events:none}
.spinner{width:32px;height:32px;border:3px solid rgba(0, 0, 0,.12);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);z-index:98;background:rgba(15,24,37,.88);backdrop-filter:blur(14px);color:#fff;padding:12px 26px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .22s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ===== Drawers ===== */
.ep-drawer{position:fixed;inset:0;z-index:400;visibility:hidden;transition:visibility .3s}
.ep-drawer.open{visibility:visible}
.ep-drawer .ep-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s}
.ep-drawer.open .ep-overlay{opacity:1}
.ep-drawer .ep-panel{position:absolute;left:0;right:0;bottom:0;max-height:75vh;background:#fff;border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .35s cubic-bezier(.22,1,.36,1);padding-top:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 -4px 30px rgba(0,0,0,.12)}
.ep-drawer.open .ep-panel{transform:translateY(0)}
.ep-drawer .ep-handle{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.15);margin:0 auto 8px;flex-shrink:0}
.ep-drawer .ep-header{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 14px;border-bottom:1px solid rgba(0,0,0,.06);flex-shrink:0}
.ep-drawer .ep-header .ep-title{font-size:16px;font-weight:600;color:#13202e}
.ep-drawer .ep-header .ep-close{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.06);border:none;color:#5e6f83;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.ep-drawer .ep-header .ep-close:active{background:rgba(0,0,0,.12);transform:scale(.9)}
.ep-drawer .ep-body{flex:1;overflow-y:auto;padding:14px 16px env(safe-area-inset-bottom,0);-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ep-drawer .ep-body::-webkit-scrollbar{width:0}
.ep-item{display:flex;align-items:center;justify-content:center;padding:0;aspect-ratio:1/1;border-radius:4px;background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.06);font-size:13px;font-weight:500;color:#2d3e52;cursor:pointer;transition:all .2s;text-align:center}
.ep-item:active{background:rgba(0, 0, 0,.12);transform:scale(.92)}
.ep-item.active{background:#ff3b30;color:#fff;border-color:#ff3b30;font-weight:600}

.cm-drawer{position:fixed;inset:0;z-index:300;visibility:hidden;transition:visibility .3s}
.cm-drawer.open{visibility:visible}
.cm-drawer .cm-overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .3s}
.cm-drawer.open .cm-overlay{opacity:1}
.cm-drawer .cm-panel{position:absolute;left:0;right:0;bottom:0;max-height:70vh;background:#fff;border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .35s cubic-bezier(.22,1,.36,1);padding-top:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 -4px 30px rgba(0,0,0,.12)}
.cm-drawer.open .cm-panel{transform:translateY(0)}
.cm-drawer .cm-handle{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.15);margin:0 auto 8px;flex-shrink:0}
.cm-drawer .cm-header{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 12px;border-bottom:1px solid rgba(0,0,0,.06);flex-shrink:0}
.cm-drawer .cm-header .cm-title{font-size:16px;font-weight:600;color:#13202e}
.cm-drawer .cm-header .cm-close{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.06);border:none;color:#5e6f83;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.cm-drawer .cm-header .cm-close:active{background:rgba(0,0,0,.12);transform:scale(.9)}
.cm-drawer .cm-body{flex:1;overflow-y:auto;padding:0 0 env(safe-area-inset-bottom,0);-webkit-overflow-scrolling:touch}
.cm-drawer .cm-body::-webkit-scrollbar{width:0}
.cm-item{display:flex;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(0,0,0,.05)}
.cm-item .cm-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1.5px solid rgba(0,0,0,.08)}
.cm-item .cm-content{flex:1;min-width:0}
.cm-item .cm-meta{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.cm-item .cm-meta .cm-name{font-size:13px;font-weight:600;color:#13202e}
.cm-item .cm-meta .cm-time{font-size:11px;color:rgba(94,111,131,.7)}
.cm-item .cm-text{font-size:14px;line-height:1.55;color:#2d3e52;word-break:break-word}
.cm-item .cm-actions{margin-top:6px;display:flex;gap:8px}
.cm-item .cm-actions button{background:none;border:none;color:rgba(94,111,131,.7);font-size:11px;cursor:pointer;padding:3px 8px;border-radius:999px;transition:all .2s;display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.03)}
.cm-item .cm-actions button:active{background:rgba(255, 59, 48,.12);color:#ff3b30}
.comment-panel{padding:12px 16px 0}
.comment-panel .comment-header{display:flex;align-items:center;gap:8px;color:rgba(94,111,131,.8);font-size:13px;margin-bottom:10px;padding:0 4px}
.comment-panel .comment-header .comment-title{font-weight:600;color:#13202e;font-size:14px}
.comment-input-wrap{display:flex;gap:8px;margin-bottom:14px;padding:0 4px}
.comment-input-wrap input{flex:1;min-width:0;padding:10px 16px;border-radius:999px;border:1.5px solid rgba(0,0,0,.08);background:#f5f7fa;color:#13202e;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
.comment-input-wrap input:focus{border-color:#000000;box-shadow:0 0 0 3px rgba(0, 0, 0,.12)}
.comment-input-wrap input::placeholder{color:rgba(94,111,131,.6)}
.comment-input-wrap .send-btn{border:none;border-radius:999px;padding:10px 20px;background:#000000;color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(0, 0, 0,.3)}
.comment-input-wrap .send-btn:active{transform:scale(.95);box-shadow:0 1px 4px rgba(0, 0, 0,.2)}
.comment-count{font-size:12px;color:rgba(94,111,131,.6)}

.lp-drawer{position:fixed;inset:0;z-index:500;visibility:hidden;transition:visibility .3s}
.lp-drawer.open{visibility:visible}
.lp-drawer .lp-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s}
.lp-drawer.open .lp-overlay{opacity:1}
.lp-drawer .lp-panel{position:absolute;left:0;right:0;bottom:0;background:#1c2633;border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .35s cubic-bezier(.22,1,.36,1);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0));box-shadow:0 -4px 30px rgba(0,0,0,.4)}
.lp-drawer.open .lp-panel{transform:translateY(0)}

  {title:'丞相府今日开饭',category:'喜剧',episodes:'全24集',creator:'LENS',views:'1.8万完播',heat:'198.4万热度',rating:'4.7',desc:'丞相府的厨房里藏着天下大势，一道菜引发的朝堂风波。',img:'image/chengxiangfu_cover.jpg',video:'video/丞相府今日开饭.mp4',total:24},
  {title:'隔世追凶',category:'悬疑',episodes:'全18集',creator:'NOVA',views:'3.1万完播',heat:'412.7万热度',rating:'4.5',desc:'跨越三十年的连环悬案，AI侦探与人类警探联手揭开尘封真相。',img:'https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80',video:'',total:18},

// ================================================================
// 首页 Feed 模式
// ================================================================
if(!isPlayerMode){
  var feedIdx=0,feedAnim=false,wh=window.innerHeight;
  var feedTrack=document.getElementById('feedTrack');

  var feedApp=document.getElementById('feedApp');

  function buildFeedSlides(){
    var h='';
    for(var i=0;i<dramas.length;i++){
      var d=dramas[i];
      h+='<div class="feed-slide" style="top:'+(i*100)+'vh">'+
        (d.video?'<video class="slide-video" src="'+d.video+'" muted loop playsinline poster="'+d.img+'"'+(i===0?' autoplay':'')+'></video>':'<img class="slide-img" src="'+d.img+'" alt="'+d.title+'" loading="'+(i===0?'eager':'lazy')+'" onerror="this.style.display=\'none\'"/>')+
        '<div class="slide-mask"></div>'+
        '<div class="feed-info">'+
          '<div class="fi-title">'+d.title+'</div>'+
          '<div class="fi-desc">'+d.desc+'</div>'+
        '</div>'+
        '<div class="feed-actions">'+
          '<button class="feed-act-btn" data-act="like" data-idx="'+i+'"><div class="feed-act-icon">🤍</div><span class="feed-act-label">点赞</span></button>'+
          '<button class="feed-act-btn" data-act="fav" data-idx="'+i+'"><div class="feed-act-icon">☆</div><span class="feed-act-label">收藏</span></button>'+
          '<button class="feed-act-btn" data-act="cmt" data-idx="'+i+'"><div class="feed-act-icon">💬</div><span class="feed-act-label">评论</span></button>'+
        '</div></div>';
    }
    feedTrack.innerHTML=h;
    feedTrack.style.height=(dramas.length*100)+'vh';
  }

  /* 动态加载底栏导航 */
  var navScript = document.createElement('script');
  navScript.src = 'load-bottom-nav.js';
  document.body.appendChild(navScript);

  function updateFeedDetailBtn(){
    var d=dramas[feedIdx];
    feedDetailBtn.textContent='查看「'+d.title+'」详情';
  }

  function goToFeed(i,animate){
    if(feedAnim)return;
    if(animate)feedAnim=true;
    i=Math.max(0,Math.min(dramas.length-1,i));
    feedIdx=i;
    // 暂停所有 feed 视频
    document.querySelectorAll('.slide-video').forEach(function(v){v.pause()});
    feedTrack.style.transition=animate?'transform .38s cubic-bezier(.22,1,.36,1)':'none';
    feedTrack.style.transform='translateY('+(-i*wh)+'px)';
    // 播放当前 feed 视频
    var curVideo=document.querySelector('#feedTrack .feed-slide:nth-child('+(i+1)+') .slide-video');
    if(curVideo){curVideo.currentTime=0;curVideo.play().catch(function(){})}
    updateFeedDetailBtn();
    if(animate)setTimeout(function(){feedAnim=false},400);
  }

  function nextFeed(){if(feedIdx>=dramas.length-1){showToast('— 已经到底了 —');return}goToFeed(feedIdx+1,true)}
  function prevFeed(){if(feedIdx<=0){showToast('— 已是第一个 —');return}goToFeed(feedIdx-1,true)}

  // Feed 详情按钮
  feedDetailBtn.addEventListener('click',function(e){
    e.stopPropagation();
    var d=dramas[feedIdx];
    location.href='drama-player.html?title='+encodeURIComponent(d.title)+'&total='+d.total+'&cover='+encodeURIComponent(d.img)+'&desc='+encodeURIComponent(d.desc)+'&video='+encodeURIComponent(d.video||'');
  });

  // Feed 点击
  document.addEventListener('click',function(e){
    if(!isPlayerMode&&feedApp&&!feedApp.classList.contains('hidden')){
      var slide=e.target.closest('.feed-slide');
      if(slide&&!e.target.closest('.feed-actions')&&!e.target.closest('.feed-info')&&!e.target.closest('.feed-top')&&!e.target.closest('.feed-bottom')){
        var d=dramas[feedIdx];
        location.href='drama-player.html?title='+encodeURIComponent(d.title)+'&total='+d.total+'&cover='+encodeURIComponent(d.img)+'&desc='+encodeURIComponent(d.desc)+'&video='+encodeURIComponent(d.video||'');
      }
    }
  });

  // Feed 互动按钮事件
  document.addEventListener('click',function(e){
    var btn=e.target.closest('.feed-act-btn');
    if(!btn)return;
    e.stopPropagation();
    var act=btn.dataset.act;
    var ic=btn.querySelector('.feed-act-icon');
    if(act==='like'){
      if(ic.classList.contains('liked')){ic.classList.remove('liked');ic.textContent='🤍'}else{ic.classList.add('liked');ic.textContent='❤️';showToast('已点赞 ❤️')}
    }else if(act==='fav'){
      if(ic.classList.contains('bookmarked')){ic.classList.remove('bookmarked');ic.textContent='☆'}else{ic.classList.add('bookmarked');ic.textContent='⭐';showToast('已收藏 ⭐')}
    }else if(act==='cmt'){
      showToast('💬 评论功能开发中');
    }
  });

  // Feed 上下滑
  var feedTs=0,feedTd=0,feedSw=0,feedLongFired=false,feedLongTimer=null;
  document.addEventListener('touchstart',function(e){
    if(isPlayerMode)return;
    if(feedApp.classList.contains('hidden'))return;
    if(e.target.closest('.feed-actions')||e.target.closest('.feed-top')||e.target.closest('.feed-bottom')||e.target.closest('.lp-drawer')||e.target.closest('.report-drawer'))return;
    feedTs=e.touches[0].clientY;feedSw=1;feedLongFired=false;
    feedLongTimer=setTimeout(function(){feedLongFired=true;openLpDrawer();},600);
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(isPlayerMode||feedApp.classList.contains('hidden')||!feedSw)return;
    feedTd=e.touches[0].clientY-feedTs;
    var max=wh*.12,dr=Math.max(-max,Math.min(max,feedTd));
    if((feedIdx===0&&dr>0)||(feedIdx>=dramas.length-1&&dr<0))dr*=.25;
    feedTrack.style.transition='none';
    feedTrack.style.transform='translateY('+(-feedIdx*wh+dr)+'px)';
    if(Math.abs(feedTd)>10){clearTimeout(feedLongTimer);feedLongTimer=null;}
  },{passive:true});
  document.addEventListener('touchend',function(){
    clearTimeout(feedLongTimer);feedLongTimer=null;
    if(feedLongFired){feedLongFired=false;feedSw=0;feedTd=0;return;}
    if(!feedSw)return;feedSw=0;
    if(feedTd<-wh*.12)nextFeed();
    else if(feedTd>wh*.12)prevFeed();
    else goToFeed(feedIdx,true);
    feedTd=0;
  },{passive:true});

  // 初始化
  buildFeedSlides();
  updateFeedDetailBtn();
  goToFeed(0,false);

  window.addEventListener('resize',function(){wh=window.innerHeight;goToFeed(feedIdx,false)});
  document.addEventListener('keydown',function(e){
    if(isPlayerMode||feedApp.classList.contains('hidden'))return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight')nextFeed();
    else if(e.key==='ArrowUp'||e.key==='ArrowLeft')prevFeed();
  });

  setTimeout(function(){loading.classList.add('hide')},350);

// ================================================================
// 播放器模式
// ================================================================
} else {
  var params=new URLSearchParams(location.search);
  var dramaTitle=params.get('title')||'未命名短剧';
  var dramaTotal=parseInt(params.get('total'))||24;
  var dramaCover=params.get('cover')||'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=800&q=80';

  var dramaVideo=params.get('video')||'';
      var total=Math.min(dramaTotal,60);
      var episodes=[];
      for(var i=0;i<total;i++)episodes.push({idx:i,label:'第'+(i+1)+'集',cover:dramaCover,desc:''});

      // Works 模式
      var isWorksMode = params.get('mode') === 'works';
      var worksData = [];
      var worksTotal = 0;
      if (isWorksMode) {
        try {
          worksData = JSON.parse(decodeURIComponent(params.get('works') || '[]'));
          worksTotal = worksData.length;
        } catch(e) {
          worksData = [];
          worksTotal = 0;
        }
      }

  document.getElementById('playerApp').classList.add('active');
  document.getElementById('feedApp').classList.add('hidden');
  var idx=0,animFlag=false,paused=false,wh=window.innerHeight;Object.defineProperty(window,"playerPaused",{get:function(){return paused},set:function(v){paused=v}});
  var track=document.getElementById('track'),toastEl=document.getElementById('toast');
  var epBadge=document.getElementById('epBadge'),backBtn=document.getElementById('backBtn');
  var bbEpBtn=document.getElementById('bbEpBtn'),bbFullBtn=document.getElementById('bbFullBtn'),bbEpTotal=document.getElementById('bbEpTotal');
  bbEpTotal.textContent=total;

  var cmDrawer=document.getElementById('cmDrawer'),cmBody=document.getElementById('cmBody'),cmTitle=document.getElementById('cmTitle');
  var epDrawer=document.getElementById('epDrawer'),epBody=document.getElementById('epBody');
  var playerProg=document.getElementById('playerProgress'),ppFill=document.getElementById('ppFill'),ppThumb=document.getElementById('ppThumb');
  var ppTooltip=document.getElementById('ppTooltip'),ppTipImg=document.getElementById('ppTipImg'),ppTipTime=document.getElementById('ppTipTime');

  bbEpBtn.addEventListener('click',function(e){e.stopPropagation();openEpDrawer()});
  var cleanMode=false;
  bbFullBtn.addEventListener('click',function(e){
    e.stopPropagation();
    cleanMode=!cleanMode;
    document.getElementById('playerApp').classList.toggle('clean-mode',cleanMode);
    this.classList.toggle('active',cleanMode);
  });

  var playProgress=0,playInterval=null;
  var PROGRESS_SPEED=0.003,EP_DURATION_SEC=45;

  function startPlayProgress(){
    if(playInterval)return;
    playInterval=setInterval(function(){
      if(paused)return;
      playProgress=Math.min(1,playProgress+PROGRESS_SPEED);
      ppFill.style.width=(playProgress*100)+'%';
      if(playProgress>=1){
        clearInterval(playInterval);playInterval=null;
        if(autoPlayNext)nextSlide();
        else{playProgress=0;ppFill.style.width="0%";startPlayProgress();}
      }
    },100);
  }

  function fmtTime(progress){
    var t=Math.round(progress*EP_DURATION_SEC);

    document.querySelectorAll('[data-act="fav"]').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();var ic=this.querySelector('.player-act-icon');if(ic.classList.contains('bookmarked')){ic.classList.remove('bookmarked');ic.innerHTML='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>'}else{ic.classList.add('bookmarked');ic.innerHTML='<svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>';showToast('已收藏')}})});
    document.querySelectorAll('[data-act="cmt"]').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();var epIdx=parseInt(this.dataset.idx);if(!isNaN(epIdx))openDrawer(epIdx)})});
    document.querySelectorAll('.pi-title').forEach(function(el){el.addEventListener('click',function(e){e.stopPropagation();openDrawer(idx);setTimeout(function(){var t=document.querySelector('#cmDrawer .cm-tab[data-cmtab="drama"]');if(t)t.click()},100)})});
    document.querySelectorAll('.desc-expand').forEach(function(el){el.addEventListener('click',function(e){e.stopPropagation();var txt=this.parentElement.querySelector('.desc-text');if(!txt)return;if(txt.classList.contains('expanded')){txt.classList.remove('expanded');this.textContent='展开'}else{txt.classList.add('expanded');this.textContent='收起'}})});
    document.querySelectorAll('.slide').forEach(function(el){el.addEventListener('click',togglePause)});
  }

  document.getElementById('cmClose').addEventListener('click',closeDrawer);
  document.getElementById('cmOverlay').addEventListener('click',closeDrawer);
  document.getElementById('epClose').addEventListener('click',closeEpDrawer);
  document.getElementById('epOverlay').addEventListener('click',closeEpDrawer);
  backBtn.addEventListener('click',function(){history.back()});
  playerProg.addEventListener('mousedown',onProgressPointerDown);
  playerProg.addEventListener('touchstart',onProgressPointerDown,{passive:true});

  // Player 上下滑
  var p_ts=0,p_td=0,p_sw=0,p_longFired=false,p_longTimer=null;
  document.addEventListener('touchstart',function(e){
    if(!isPlayerMode)return;
    if(e.target.closest('.player-actions')||e.target.closest('.player-info')||e.target.closest('.top-back')||e.target.closest('.cm-drawer')||e.target.closest('.player-bottom-bar')||e.target.closest('.ep-drawer')||e.target.closest('.lp-drawer')||e.target.closest('.report-drawer'))return;
    p_ts=e.touches[0].clientY;p_sw=1;p_longFired=false;
    p_longTimer=setTimeout(function(){p_longFired=true;openLpDrawer()},600);
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!isPlayerMode||!p_sw)return;
    p_td=e.touches[0].clientY-p_ts;var max=wh*.12,dr=Math.max(-max,Math.min(max,p_td));
    if((idx===0&&dr>0)||(idx>=total-1&&dr<0))dr*=.25;
    track.style.transition='none';track.style.transform='translateY('+(-idx*wh+dr)+'px)';
    if(Math.abs(p_td)>10){clearTimeout(p_longTimer);p_longTimer=null}
  },{passive:true});
  document.addEventListener('touchend',function(){
    clearTimeout(p_longTimer);p_longTimer=null;
    if(p_longFired){p_longFired=false;p_sw=0;p_td=0;return}
    if(!p_sw)return;p_sw=0;
    if(p_td<-wh*.12)nextSlide();else if(p_td>wh*.12)prevSlide();else goTo(idx,true);
    p_td=0;
  },{passive:true});

  window.addEventListener('resize',function(){wh=window.innerHeight;goTo(idx,false)});
  document.addEventListener('keydown',function(e){
    if(!isPlayerMode)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight')nextSlide();
    else if(e.key==='ArrowUp'||e.key==='ArrowLeft')prevSlide();
  });

  updateMeta();render();
  document.getElementById('loading').classList.add('hide');
  if (window.innerWidth >= 769 && !isWorksMode) {
    openDrawer(0);
  }
}

// ===== 举报系统（公共） =====
var lpDrawer=document.getElementById('lpDrawer'),lpOverlay=document.getElementById('lpOverlay');
var lpReportBtn=document.getElementById('lpReportBtn'),lpCancel=document.getElementById('lpCancel');
var reportDrawer=document.getElementById('reportDrawer'),reportOverlay=document.getElementById('reportOverlay');
var reportBack=document.getElementById('reportBack'),reportTypeGrid=document.getElementById('reportTypeGrid');
var reportDesc=document.getElementById('reportDesc'),reportSubmitBtn=document.getElementById('reportSubmitBtn');
var selectedReportType=null;
var REPORT_LABELS={porn:'低俗色情',illegal:'涉嫌违法犯罪',sensitive:'内容敏感',gambling:'涉黑赌博',minor:'侵害未成年人',copyright:'侵权投诉',quality:'质量问题',other:'其他'};

function openLpDrawer(){lpDrawer.classList.add('open')}
function closeLpDrawer(){lpDrawer.classList.remove('open')}
function openReportDrawer(){selectedReportType=null;reportSubmitBtn.disabled=true;reportDesc.value='';document.querySelectorAll('.report-type-btn').forEach(function(b){b.classList.remove('selected')});reportDrawer.classList.add('open')}
function closeReportDrawer(){reportDrawer.classList.remove('open')}
function closeAllDrawers(){closeLpDrawer();closeReportDrawer()}

reportTypeGrid.addEventListener('click',function(e){
  var btn=e.target.closest('.report-type-btn');if(!btn)return;
  document.querySelectorAll('.report-type-btn').forEach(function(b){b.classList.remove('selected')});
  btn.classList.add('selected');selectedReportType=btn.dataset.type;reportSubmitBtn.disabled=false;
});
reportSubmitBtn.addEventListener('click',function(){
  if(!selectedReportType){showToast('请选择举报类型');return}
  var label=REPORT_LABELS[selectedReportType]||selectedReportType;
  var desc=reportDesc.value.trim();
  var msg='✅ 已举报「'+label+'」';if(desc)msg+=', 描述已收到';msg+=', 我们会尽快处理';
  closeAllDrawers();showToast(msg);
});
lpReportBtn.addEventListener('click',function(){openReportDrawer()});
lpCancel.addEventListener('click',function(){closeLpDrawer()});
lpOverlay.addEventListener('click',function(){closeLpDrawer()});
reportBack.addEventListener('click',function(){closeReportDrawer()});
reportOverlay.addEventListener('click',function(){closeReportDrawer()});

})();
</script>
