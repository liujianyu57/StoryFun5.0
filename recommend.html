<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#ffffff;--surface:#ffffff;--accent:#000000;--accent-soft:rgba(0, 0, 0,0.12);--text:#13202e;--text-muted:#5e6f83;--border:#deeaf7;--radius:24px;font-family:"PingFang SC","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);-webkit-tap-highlight-color:transparent;user-select:none}
#app{position:fixed;inset:0;overflow:hidden;background:#fff}
.watch-bar{position:fixed;left:0;right:0;bottom:calc(50px + 6px);z-index:102;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(0,0,0,.04);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid rgba(0,0,0,.08);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .2s}
.watch-bar:active{background:rgba(0,0,0,.06)}
.watch-bar .wb-left{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.9);font-size:12px;font-weight:500;min-width:0}
.watch-bar .wb-left svg{width:18px;height:18px;flex-shrink:0}
.watch-bar .wb-left .wb-text{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.watch-bar .wb-right{display:flex;align-items:center;gap:4px;color:rgba(255,255,255,.6);font-size:12px;font-weight:400;flex-shrink:0;margin-left:8px}
.watch-bar .wb-right svg{width:16px;height:16px}
#track{position:absolute;left:0;top:0;width:100%;will-change:transform}
.slide{position:absolute;left:0;width:100%;height:100vh;overflow:hidden}
.slide-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.slide-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#000}
.slide-mask{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,24,37,0.1),rgba(15,24,37,0.05) 30%,rgba(15,24,37,0.4) 70%,rgba(15,24,37,0.82));pointer-events:none}
.play-btn{position:absolute;top:50%;left:50%;z-index:3;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:.5px solid rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.1)}
.play-btn.show{opacity:1}
.play-btn svg{width:30px;height:30px;fill:#333;margin-left:3px}
.info{position:absolute;left:18px;right:80px;bottom:calc(12px + 44px + 44px + 12px + env(safe-area-inset-bottom,0px));z-index:2;display:flex;flex-direction:column;gap:8px}
.danmaku-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px 4px 8px;border-radius:999px;font-size:11px;font-weight:500;color:rgba(255,255,255,.95);background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:.5px solid rgba(255,255,255,.2);cursor:pointer;transition:background .15s;align-self:flex-start;margin-bottom:2px}
.danmaku-btn:active{background:rgba(255,255,255,.25)}
.menu-btn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:230;width:44px;height:44px;border-radius:50%;background:transparent;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .25s;-webkit-tap-highlight-color:transparent}
.menu-btn svg{width:22px;height:22px;stroke:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.menu-btn:active{transform:scale(.88)}
.search-btn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:230;width:44px;height:44px;border-radius:50%;background:transparent;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .25s;-webkit-tap-highlight-color:transparent}
.search-btn svg{width:22px;height:22px;stroke:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.search-btn:active{transform:scale(.88)}
.side-overlay{position:fixed;inset:0;z-index:298;background:transparent;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.side-overlay.open{opacity:1;visibility:visible}
.side-drawer{position:fixed;top:0;left:0;bottom:0;z-index:299;width:300px;max-width:82vw;background:#fff;transform:translateX(-100%);transition:transform .25s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;box-shadow:4px 0 40px rgba(0,0,0,.12);border-right:.5px solid rgba(0,0,0,.06);will-change:transform;contain:layout style}
.side-drawer.open{transform:translateX(0)}
    /* ── Web2 入口抽屉（个人主页 / 创作 / 设置等入口收敛） ── */
    .sd-body{flex:1;overflow-y:auto;padding:4px 10px calc(12px + env(safe-area-inset-bottom,0px))}
    .sd-acc{display:flex;align-items:center;gap:12px;padding:12px;margin:2px 2px 8px;border-radius:16px;background:rgba(0,0,0,.03);cursor:pointer}
    .sd-acc:active{background:rgba(0,0,0,.07)}
    .sd-ava{width:46px;height:46px;border-radius:50%;background:#0a0b0d;color:#fff;display:grid;place-items:center;font-size:18px;font-weight:700;overflow:hidden;flex-shrink:0}
    .sd-ava img{width:100%;height:100%;object-fit:cover}
    .sd-acc-main{flex:1;min-width:0}
    .sd-acc-name{display:block;font-size:15px;font-weight:700;color:#1a1a2e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sd-acc-sub{display:block;font-size:11px;color:rgba(0,0,0,.35);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sd-acc-go{font-size:18px;color:rgba(0,0,0,.22);flex-shrink:0}
    .sd-group{margin:0 0 4px}
    .sd-group-label{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:rgba(0,0,0,.32);padding:8px 12px 4px;text-transform:uppercase}
    .sd-row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;color:#1a1a2e;background:none;border:0;font-family:inherit;font-size:14px;font-weight:500;text-align:left;cursor:pointer;text-decoration:none;transition:background .15s;box-sizing:border-box}
    .sd-row:hover,.sd-row:active{background:rgba(0,0,0,.05)}
    .sd-row-ic{width:32px;height:32px;border-radius:9px;background:rgba(0,0,0,.05);color:#1a1a2e;display:grid;place-items:center;flex-shrink:0}
    .sd-row-ic svg{width:17px;height:17px}
    .sd-row-go{margin-left:auto;color:rgba(0,0,0,.22);font-size:17px}
    .sd-row.danger{color:#f45b69}
    .sd-row.danger .sd-row-ic{background:rgba(244,91,105,.08);color:#f45b69}
    .sd-foot{padding:10px 16px 4px;text-align:center;font-size:10.5px;color:rgba(0,0,0,.28)}
    @media(min-width:769px){.menu-btn,.side-drawer,.side-overlay{display:none!important}}

.sd-header{display:flex;align-items:center;justify-content:flex-end;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.sd-close{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.06);border:none;color:#666;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.sd-close:active{background:rgba(0,0,0,.12);color:#333}
.sd-user{display:flex;flex-direction:column;align-items:center;padding:8px 20px 20px;gap:10px}
.sd-avatar{width:64px;height:64px;border-radius:50%;object-fit:contain;border:2px solid rgba(0,0,0,.08);box-shadow:0 0 24px rgba(0, 0, 0,.15)}
.sd-nickname{font-size:16px;font-weight:700;color:#1a1a2e}
.sd-uid{font-size:11px;color:rgba(0,0,0,.4)}
.sd-section-label{font-size:10px;font-weight:700;color:rgba(0,0,0,.4);letter-spacing:.08em;text-transform:uppercase;padding:8px 20px 6px}
.sd-notify-list{padding:0 16px}
.sd-notify-item{display:flex;align-items:flex-start;gap:10px;padding:10px 8px;border-radius:12px;transition:background .15s;cursor:pointer}
.sd-notify-item:hover,.sd-notify-item:active{background:rgba(0,0,0,.03)}
.sd-notify-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex-shrink:0}
.sd-notify-text{font-size:13px;color:rgba(0,0,0,.7);line-height:1.4;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd-notify-time{font-size:10px;color:rgba(0,0,0,.35);margin-top:2px}
.sd-history-list{padding:0 16px;display:flex;gap:8px}
.sd-history-item{flex:1;display:flex;flex-direction:column;gap:4px;border-radius:10px;transition:transform .15s;cursor:pointer;text-align:center;overflow:hidden}
.sd-history-item:hover,.sd-history-item:active{transform:scale(0.97)}
.sd-history-cover{width:100%;aspect-ratio:2/3;border-radius:8px;object-fit:cover;display:block}
.sd-history-title{font-size:11px;font-weight:600;color:#1a1a2e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.sd-history-ep{font-size:10px;color:rgba(0,0,0,.45);line-height:1.2}
.dm-layer{position:absolute;left:0;right:0;top:calc(56px + env(safe-area-inset-top,0px));z-index:3;height:140px;overflow:hidden;pointer-events:none}
.dm-item{position:absolute;white-space:nowrap;font-size:20px;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7);animation:dmScroll linear infinite backwards}
@keyframes dmScroll{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}
.danmaku-btn svg{width:15px;height:15px;flex-shrink:0}
.info-title{font-size:17px;font-weight:700;color:#fff;line-height:1.3;text-shadow:0 1px 4px rgba(0,0,0,.1);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.info-title>.gt{color:rgba(255,255,255,.45);font-size:17px;margin-left:1px}
.info-tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.info-tag{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);color:#fff;border:.5px solid rgba(255,255,255,.25)}
.info-rating{display:inline-flex;align-items:center;gap:2px;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);color:#fff;border:.5px solid rgba(255,255,255,.25)}
.info-rating .star{color:rgba(255,255,255,.85);margin-right:1px}
.info-ep{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);color:#fff;border:.5px solid rgba(255,255,255,.25);margin-left:4px}
.info-desc{font-size:12px;color:rgba(255,255,255,.75);line-height:1.5;display:flex;align-items:center;gap:4px;margin-top:-2px;flex-wrap:wrap}
.info-desc .desc-ep{color:rgba(255,255,255,.55);font-weight:400}
.info-desc .desc-sep{color:rgba(255,255,255,.3);margin:0 2px}
.info-desc .desc-text{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1;min-width:0;max-width:400px;color:rgba(255,255,255,.65)}
.info-desc .desc-expand{color:rgba(255,255,255,.85);font-weight:500;font-size:11px;cursor:pointer;flex-shrink:0;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.15);border:.5px solid rgba(255,255,255,.2);transition:background .15s}
.info-desc .desc-expand:active{background:rgba(255,255,255,.25)}.desc-text.expanded{white-space:normal!important;overflow:visible!important}.desc-text.expanded{white-space:normal!important;overflow:visible!important}
.info-crew{font-size:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:-2px}
.info-crew .c-item{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;line-height:1.3;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:.5px solid rgba(255,255,255,.2)}
.info-crew .c-item .c-label{color:rgba(255,255,255,.55);font-weight:400}
.info-crew .c-item .c-name{color:rgba(255,255,255,.9);font-weight:600}
.info-crew .c-div{color:rgba(255,255,255,.3);font-size:10px}
.info-author{font-size:12px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:5px;cursor:pointer}
.info-author img{width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,.2);object-fit:contain}
.actions{position:absolute;right:10px;bottom:calc(20px + 44px + 44px + env(safe-area-inset-bottom,0px) + 40px);z-index:2;display:flex;flex-direction:column;align-items:center;gap:16px}
.act-creator{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:none;padding:0;color:#fff;-webkit-tap-highlight-color:transparent}
.act-creator .ac-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(0,0,0,.1);box-shadow:0 2px 12px rgba(0,0,0,.1);transition:transform .15s}
.act-creator:active .ac-avatar{transform:scale(.85)}
.act-creator .ac-label{font-size:9px;font-weight:500;color:rgba(255,255,255,.8);line-height:1;padding:1px 6px;border-radius:999px;background:rgba(0,0,0,.05);backdrop-filter:blur(4px);max-width:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-follow{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:#ff2d55;border:2px solid rgba(0,0,0,.1);color:#fff;font-size:14px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;transition:all .2s;box-shadow:0 2px 6px rgba(255,45,85,.4)}
.ac-follow.followed{background:rgba(0,0,0,.8);border-color:var(--text-muted);color:#fff;font-size:10px;box-shadow:none}
.act-creator{position:relative}
.act-btn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border:none;background:none;padding:0;color:#fff;-webkit-tap-highlight-color:transparent;transition:transform .15s}
.act-btn:active{transform:scale(.82)}
.act-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:none;font-size:18px;transition:all .2s}
.act-icon.liked{color:#ff4d6a}
.act-icon.bookmarked{color:#ffbb3a}
.act-label{font-size:10px;font-weight:500;color:rgba(255,255,255,.75);line-height:1}
.act-more-btn{position:relative}.act-more-popup{position:absolute;right:calc(100% + 6px);top:auto;bottom:4px;background:rgba(30,30,30,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:10px;padding:4px 0;min-width:110px;z-index:10;display:flex;flex-direction:column}.act-more-item{padding:10px 18px;font-size:12px;color:rgba(255,255,255,.85);cursor:pointer;white-space:nowrap;transition:background .15s;text-align:left}.act-more-item:hover{background:rgba(255,255,255,.08)}.act-more-item:active{background:rgba(255,255,255,.15)}
.player-progress{position:fixed;left:0;right:0;bottom:50px;z-index:103;height:8px;background:rgba(0,0,0,.8);cursor:pointer;pointer-events:auto;touch-action:none;overflow:hidden}
.player-progress .pp-fill{height:100%;width:1%;min-width:2px;background:linear-gradient(90deg,#000000,#666666);position:relative;transition:none}
.player-progress .pp-fill .pp-thumb{position:absolute;right:-7px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:#fff;border:2.5px solid #000000;box-shadow:0 1px 6px rgba(0,0,0,.12);opacity:0;transition:opacity .2s}
.player-progress:active .pp-fill .pp-thumb,.player-progress:hover .pp-fill .pp-thumb,.player-progress.show-thumb .pp-fill .pp-thumb{opacity:1}
.pp-tooltip{position:fixed;z-index:105;pointer-events:none;opacity:0;transition:opacity .15s;left:50%;transform:translateX(-50%);bottom:calc(50px + 6px + 24px)}
.pp-tooltip.show{opacity:1}
.pp-tooltip .pp-tip-img{width:86px;height:130px;border-radius:10px;object-fit:contain;display:block;box-shadow:0 4px 20px rgba(0,0,0,.15);border:2px solid rgba(0,0,0,.08)}
.pp-tooltip .pp-tip-time{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);background:rgba(0,0,0,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;border:.5px solid rgba(255,255,255,.12)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:99;transition:opacity .4s}
#loading.hide{opacity:0;pointer-events:none}
.spinner{width:32px;height:32px;border:3px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);z-index:98;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);color:var(--text);padding:12px 26px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .22s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.cm-drawer{position:fixed;inset:0;z-index:300;display:none}
.cm-drawer.open{display:block}
.cm-drawer .cm-overlay{position:absolute;inset:0;background:transparent;opacity:0;transition:opacity .3s}
.cm-drawer.open .cm-overlay{opacity:1}
.cm-drawer .cm-panel{position:absolute;left:0;right:0;bottom:0;max-height:70vh;background:#1a1a2e;border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .35s cubic-bezier(.22,1,.36,1);padding-top:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 -4px 30px rgba(0,0,0,.12)}
.cm-drawer.open .cm-panel{transform:translateY(0)}
.cm-drawer .cm-handle{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:0 auto 8px;flex-shrink:0}

.cm-drawer .cm-header .cm-close{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.7);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.cm-drawer .cm-header .cm-close:active{background:rgba(255,255,255,.2);transform:scale(.9)}
.cm-drawer .cm-body{flex:1;overflow-y:auto;padding:0 0 env(safe-area-inset-bottom,0)}
.cm-drawer .cm-body::-webkit-scrollbar{width:0}
.cm-footer{padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0));border-top:1px solid rgba(255,255,255,.1);flex-shrink:0}

.cm-detail-cover{width:80px;height:110px;border-radius:8px;object-fit:cover;flex-shrink:0}
.cm-detail-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:center}
.cm-detail-title{font-size:16px;font-weight:700;color:#fff;line-height:1.3}
.cm-detail-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cm-detail-rating{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.1);font-size:11px;font-weight:600;color:#fff}

function doSearch(query) {
  if (!query || !query.trim()) return;
  query = query.trim();
  saveRecentSearch(query);
  location.href = 'search-results.html?q=' + encodeURIComponent(query);
}
function saveRecentSearch(q) {
  var list = JSON.parse(localStorage.getItem('dh_recent_searches') || '[]');
  list = list.filter(function(item) { return item !== q; });
  list.unshift(q);
  if (list.length > 8) list.pop();
  localStorage.setItem('dh_recent_searches', JSON.stringify(list));
}
function renderSearchDropdown() {
  var hotTags = ['凤骨琉璃', '打斗精彩片段', '古风短剧', '科幻短剧', '悬疑短剧', '星际拓荒者', '时间管理局', '丞相府今日开饭'];
  var hotEl = document.getElementById('sdHotTags');
  if (hotEl) {
    hotEl.innerHTML = hotTags.map(function(t) {
      return '<button class="sd-tag">'+t+'</button>';
    }).join('');
  }
  var recent = JSON.parse(localStorage.getItem('dh_recent_searches') || '[]');
  var recentSection = document.getElementById('sdRecentSection');
  var recentList = document.getElementById('sdRecentList');
  if (recentSection && recentList && recent.length > 0) {
    recentSection.style.display = '';
    recentList.innerHTML = recent.map(function(r) {
      return '<div class="sd-item"><span>'+r+'</span><button class="sd-del">✕</button></div>';
    }).join('');
  } else if (recentSection) {
    recentSection.style.display = 'none';
  }
}
function removeRecentSearch(q) {
  var list = JSON.parse(localStorage.getItem('dh_recent_searches') || '[]');
  list = list.filter(function(item) { return item !== q; });
  localStorage.setItem('dh_recent_searches', JSON.stringify(list));
  renderSearchDropdown();
}

  },
  buildDetailHTML: function(d) {
    if (d.type !== 'drama') return '';
    var epURL = 'drama-player.html?id=' + d.id + '&title=' + encodeURIComponent(d.title) + '&total=' + d.totalEp + '&cat=' + encodeURIComponent(d.cat) + '&author=' + encodeURIComponent(d.author) + '&avatar=' + encodeURIComponent(d.avatar) + '&cover=' + encodeURIComponent(d.cover) + '&desc=' + encodeURIComponent(d.desc) + '&video=' + encodeURIComponent(d.video || '');
    window._cmEpURL = epURL;
    var heat = (d.likes / 10000).toFixed(1) + 'w';
    var views = (d.likes * 1.5 / 10000).toFixed(1) + 'w';
    var epGrid = '';
    for (var ei = 1; ei <= d.totalEp && ei <= 60; ei++) {
      var epDurMin = 20 + Math.floor(Math.random() * 16);
      var epDurSec = Math.floor(Math.random() * 60);
      var epDurStr = String(epDurMin).padStart(2, '0') + ':' + String(epDurSec).padStart(2, '0');
      var epLikes = Math.floor(d.likes * (0.06 + Math.random() * 0.04));
      epGrid += '<div class="cm-ep-item' + (ei === 1 ? ' active' : '') + '" data-ep="' + ei + '" onclick="cmEpSelect(' + ei + ')"><div class="cm-ep-cover-wrap"><img class="cm-ep-cover" src="' + d.cover + '" alt=""><span class="cm-ep-dur">' + epDurStr + '</span></div><div class="cm-ep-info"><div class="cm-ep-title">第' + ei + '集</div><div class="cm-ep-desc">' + d.desc + '</div><div class="cm-ep-likes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>' + fmt(epLikes) + '</div></div></div>';
    }
    return '<div class="cm-detail-panel" id="cmDetailPanel"><div class="cm-detail-header"><img class="cm-detail-cover" src="' + d.cover + '" alt="' + d.title + '"><div class="cm-detail-info"><div class="cm-detail-title">' + d.title + '</div><div class="cm-detail-meta"><span class="cm-detail-rating"><span class="star">☆ </span> ' + d.rt + '</span><span class="cm-detail-tag">' + d.cat + '</span><span class="cm-detail-tag">' + d.ep + '</span></div></div></div><div class="cm-detail-stats"><div class="cm-stat"><span class="cm-stat-num">' + views + '</span><span class="cm-stat-label">完播</span></div><div class="cm-stat"><span class="cm-stat-num">' + heat + '</span><span class="cm-stat-label">热度</span></div></div><div class="cm-detail-desc">' + d.desc + '</div><div class="cm-detail-rating-stars"><span class="cr-label">我要评分</span><span class="cr-star">★</span><span class="cr-star">★</span><span class="cr-star">★</span><span class="cr-star">★</span><span class="cr-star">★</span><span class="cr-score">未评</span></div><div class="cm-detail-ep-grid">' + epGrid + '</div></div>';
  },
  addComment: function(id, comment) {
    var d = DATA.find(function(x) { return x.id === id; });
    if (!d) return;
    ensureComments(d);
    d.comments.unshift(comment);
  }
});
