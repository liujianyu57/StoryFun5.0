<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Story.fun | 用户主页</title>
  <style>
    :root {
      --bg: #f5faff;
      --surface: #ffffff;
      --accent: #000000;
      --accent-soft: rgba(0, 0, 0, 0.10);
      --text: #13202e;
      --text-muted: #6e859e;
      --text-sub: #8b8d98;
      --border: #deeaf7;
      --border-light: #e8f0fa;
      --radius: 16px;
      font-family: -apple-system, "PingFang SC", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; margin: 0; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); }

    .mobile-top-bar { padding-top: calc(40px + env(safe-area-inset-top)); background: #fff; position: sticky; top: 0; z-index: 100; }
    .back-btn { display: inline-flex; align-items: center; gap: 4px; padding: 10px 14px; font-size: 0.88rem; font-weight: 600; color: var(--text-secondary, #405266); text-decoration: none; border-radius:999px; background: var(--surface); border: 1px solid var(--border); cursor: pointer; }

    .mobile-profile-section { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; background: #fff; }
    .mobile-profile-row { display: flex; align-items: flex-start; gap: 16px; }
    .avatar-gradient { width: 78px; height: 78px; border-radius: 99px; padding: 2px; background: #000000; flex-shrink: 0; position: relative; }
    .avatar-bg { width: 100%; height: 100%; border-radius: 99px; overflow: hidden; background: var(--bg); display: flex; align-items: center; justify-content: center; }
    .avatar-bg img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar-letter { font-size: 26px; font-weight: 700; }
    .gradient-text { background: #000000; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .mobile-profile-info { flex: 1; min-width: 0; padding-top: 4px; }
    .mp-name { font-size: 20px; font-weight: 700; color: var(--text); line-height: 1.3; }
    .mp-id { font-size: 13px; color: var(--text-sub); margin-top: 2px; }
    .mp-bio { font-size: 13px; color: var(--text-muted); margin-top: 6px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .mobile-stats { display: flex; align-items: center; gap: 0; padding: 12px 0; }
    .ms-item { flex: 1; text-align: center; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--border-light); }
    .ms-item:last-child { border-right: none; }
    .ms-num { font-size: 18px; font-weight: 700; color: var(--text); }
    .ms-label { font-size: 12px; color: var(--text-sub); }

    .follow-btn { width: 100%; margin: 8px 0; padding: 12px; border-radius: 999px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; background: #000000; color: #fff; font-family: inherit; transition: all 0.2s; }
    .follow-btn:active { opacity: 0.8; }
    .follow-btn.following { background: var(--border); color: var(--text-muted); }

    .mobile-tabs { display: flex; position: sticky; top: calc(40px + env(safe-area-inset-top)); z-index: 99; background: #fff; border-bottom: 0.5px solid var(--border-light); }
    .mtab-item { flex: 1; text-align: center; padding: 12px 0; font-size: 14px; font-weight: 500; color: var(--text-muted); cursor: pointer; border: none; background: none; font-family: inherit; position: relative; -webkit-tap-highlight-color: transparent; transition: color 0.2s; }
    .mtab-item.active { color: var(--accent); font-weight: 600; }
    .mtab-item.active::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 20px; height: 3px; border-radius: 3px; background: var(--accent); }

    .mobile-drama-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px 0; }
    .mdc { border-radius: 12px; overflow: hidden; background: var(--surface); border: 1px solid var(--border); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform 0.15s ease; }
    .mdc:active { transform: scale(0.97); }
    .mdc-thumb { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; border-bottom: 0.5px solid var(--border); }
    .mdc-body { padding: 8px 10px 10px; }
    .mdc-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px; }
    .mdc-meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); }
    .mdc-badge { padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font-size: 10px; font-weight: 600; }
    .mdc-rating { color: #ffc107; font-weight: 600; }
    .mdc-ep { color: var(--text-sub); }

    .mobile-empty { padding: 60px 24px; text-align: center; color: var(--text-sub); }
    .me-icon { font-size: 40px; margin-bottom: 12px; }
    .me-icon p { font-size: 14px; }

    .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-100px); z-index: 9999; background: rgba(26,35,47,0.95); color: #fff; padding: 14px 24px; border-radius: 14px; font-size: 0.92rem; opacity: 0; transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s; pointer-events: none; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    @media (max-width: 760px) { body { background: #fff; } }
  </style>
</head>
<body>

  <div class="mobile-top-bar">
    <button class="back-btn" onclick="history.back()">← 返回</button>
  </div>

  <div class="mobile-profile-section">
    <div class="mobile-profile-row">
      <div class="avatar-gradient">
        <div class="avatar-bg" id="mobileAvatarContainer">
          <span class="avatar-letter gradient-text" id="mobileAvatarLetter">U</span>
        </div>
      </div>
      <div class="mobile-profile-info">
        <div class="mp-name" id="mobileProfileName">用户</div>
        <div class="mp-id" id="mobileProfileId"></div>
        <div class="mp-bio" id="mobileProfileBio">这个人很懒，什么都没写</div>
      </div>
    </div>

    <button class="follow-btn" id="followBtn" onclick="toggleFollow()">+ 关注</button>

    <div class="mobile-stats">
      <div class="ms-item"><span class="ms-num">12</span><span class="ms-label">关注</span></div>
      <div class="ms-item"><span class="ms-num">88</span><span class="ms-label">粉丝</span></div>
      <div class="ms-item"><span class="ms-num">6</span><span class="ms-label">互关</span></div>
      <div class="ms-item"><span class="ms-num">999</span><span class="ms-label">获赞</span></div>
    </div>
  </div>

  <div class="mobile-tabs">
    <button class="mtab-item active" data-mtab="published" onclick="switchTab('published')">作品</button>
    <button class="mtab-item" data-mtab="liked" onclick="switchTab('liked')">赞</button>
  </div>

  <div id="tabPublished" class="mobile-drama-grid">
    <div class="mdc" onclick="location.href='drama-player.html'">
      <img class="mdc-thumb" src="image/fenggu_cover.jpg" alt="凤骨琉璃" loading="lazy" />
      <div class="mdc-body">
        <div class="mdc-title">凤骨琉璃</div>
        <div class="mdc-meta">
          <span class="mdc-badge">古风</span>
          <span class="mdc-rating">★ 4.8</span>
          <span class="mdc-ep">44集</span>
        </div>
      </div>
    </div>
    <div class="mdc" onclick="location.href='drama-player.html'">
      <img class="mdc-thumb" src="image/xiejia_cover.jpg" alt="我卸甲后天下大乱了" loading="lazy" />
      <div class="mdc-body">
        <div class="mdc-title">我卸甲后天下大乱了</div>
        <div class="mdc-meta">
          <span class="mdc-badge">古风</span>
          <span class="mdc-rating">★ 4.6</span>
          <span class="mdc-ep">12集</span>
        </div>
      </div>
    </div>
  </div>

  <div id="tabLiked" class="mobile-empty" style="display:none;">
    <div class="me-icon">❤️</div>
    <p>暂无赞过的短剧</p>
  </div>

  <div class="toast" id="toast"><span id="toastMsg"></span></div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.mtab-item').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.mtab === tab);
      });
      document.getElementById('tabPublished').style.display = tab === 'published' ? 'grid' : 'none';
      document.getElementById('tabLiked').style.display = tab === 'liked' ? 'block' : 'none';
    }

    function toggleFollow() {
      var btn = document.getElementById('followBtn');
      btn.classList.toggle('following');
      var toast = document.getElementById('toast');
      var msg = document.getElementById('toastMsg');
      if (btn.classList.contains('following')) {
        btn.textContent = '✓ 已关注';
        msg.textContent = '已关注';
      } else {
        btn.textContent = '+ 关注';
        msg.textContent = '已取消关注';
      }
      toast.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(function(){ toast.classList.remove('show'); }, 1500);
    }

    // Load author name from URL param
    var params = new URLSearchParams(window.location.search);
    var author = params.get('author');
    if (author) {
      document.getElementById('mobileProfileName').textContent = author;
      document.getElementById('mobileProfileId').textContent = '@' + author.toLowerCase();
      document.getElementById('mobileAvatarLetter').textContent = author.charAt(0);
    }
  </script>
<script src="load-sidebar.js"></script>
  <script src="load-desktop-header.js"></script>
</body>
</html>
