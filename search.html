<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>搜索 - Story.fun</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f7fa;--surface:#ffffff;--accent:#000000;--text:#1d1d1f;--text-muted:#86868b;--border:rgba(0,0,0,.08);font-family:-apple-system,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif}
html,body{width:100%;height:100%;background:var(--bg);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-font-smoothing:antialiased}
body{padding-bottom:50px;padding-bottom:calc(50px + env(safe-area-inset-bottom,0))}
.shell{max-width:480px;margin:0 auto;padding:0 20px;padding-top:calc(16px + env(safe-area-inset-top,0))}
/* Search Bar */
.search-bar-wrap{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.search-back{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.search-back:active{background:rgba(0, 0, 0,.08)}
.search-back svg{width:20px;height:20px;stroke:var(--accent)}
.search-field{flex:1;display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--surface);border-radius:12px;border:1.5px solid transparent;box-shadow:0 1px 4px rgba(0,0,0,.04);transition:border-color .25s,box-shadow .25s}
.search-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(0, 0, 0,.1)}
.search-field svg{width:18px;height:18px;flex-shrink:0;color:var(--text-muted)}
.search-field input{flex:1;border:none;background:none;font-size:16px;color:var(--text);outline:none;font-family:inherit}
.search-field input::placeholder{color:#c7c7cc}
.search-clear{width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.06);border:none;color:var(--text-muted);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;visibility:hidden}
.search-clear.show{visibility:visible}
.search-clear:active{background:rgba(0,0,0,.12)}
.search-submit-btn{flex-shrink:0;padding:9px 18px;border-radius:999px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap}
.search-submit-btn:active{opacity:.8;transform:scale(.96)}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:17px;font-weight:700;color:var(--text);letter-spacing:-.01em}
.section-sub{font-size:13px;color:var(--accent);cursor:pointer;font-weight:500}

/* Recent Searches */
.recent-list{margin-top:28px}
.recent-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:all .15s}
.recent-item:active{opacity:.6}
.recent-item .ri-left{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text);font-weight:400}
.recent-item .ri-left svg{width:16px;height:16px;color:var(--text-muted)}
.recent-item .ri-del{width:28px;height:28px;border-radius:50%;background:none;border:none;color:var(--text-muted);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.recent-item .ri-del:active{background:rgba(0,0,0,.06);color:var(--text)}
.empty-state{margin-top:40px;text-align:center;color:var(--text-muted);font-size:14px}

/* Bottom Nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:100;height:50px;padding-bottom:env(safe-area-inset-bottom,0);background:rgba(255,255,255,.88);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-top:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center}
.bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:1;height:100%;padding:4px 4px 2px;text-decoration:none;color:rgba(0,0,0,.45);transition:color .2s;-webkit-tap-highlight-color:transparent}
.bnav a.active{color:var(--accent)}
.bnav svg{width:28px;height:28px;display:block;flex-shrink:0}
.bnav span{font-weight:400;font-size:10px;line-height:12px;letter-spacing:.008em;text-align:center}
@media(min-width:769px){.bnav{display:none}body{padding-bottom:0}.shell{margin:0 auto;padding:24px;max-width:720px;margin-left:180px;padding-top:80px}}
</style>
</head>
<body>
<div class="shell">
  <div class="search-bar-wrap">
    <button class="search-back" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="search-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="searchInput" type="text" placeholder="搜索有趣的内容" autofocus />
      <button class="search-clear" id="searchClear">✕</button>
    </div>
    <button class="search-submit-btn" id="searchSubmit">搜索</button>
  </div>

  <div class="recent-list" id="recentSection">
    <div class="section-header" style="margin-top:0">
      <span class="section-title">最近搜索</span>
      <span class="section-sub" id="clearRecent">清除</span>
    </div>
    <div id="recentList"></div>
  </div>
</div>


<script>
const DATA = [
  {id:'001',title:'凤骨琉璃',cat:'古风',rt:4.6,ep:'全44集',totalEp:44,author:'JACK',cover:'image/fenggu_cover.jpg',video:'video/凤骨琉璃.mp4',likes:33300},
  {id:'002',title:'我卸甲后天下大乱了',cat:'古风',rt:4.4,ep:'全12集',totalEp:12,author:'EVA',cover:'image/xiejia_cover.jpg',video:'video/我卸甲后天下大乱了.mp4',likes:28600},
  {id:'003',title:'丞相府今日开饭',cat:'喜剧',rt:4.5,ep:'全24集',totalEp:24,author:'LENS',cover:'image/chengxiangfu_cover.jpg',video:'video/丞相府今日开饭.mp4',likes:19800},
  {id:'004',title:'时间管理局',cat:'科幻',rt:4.8,ep:'全16集',totalEp:16,author:'NOVA',cover:'https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=800&q=80',likes:32100},
  {id:'005',title:'迷途恋人',cat:'爱情',rt:3.9,ep:'全20集',totalEp:20,author:'ROSE',cover:'https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=800&q=80',likes:56000},
  {id:'006',title:'代码风暴',cat:'动作',rt:4.2,ep:'第7集 / 共30集',totalEp:30,author:'CYPHER',cover:'https://images.unsplash.com/photo-1553440569-bcc63803a83d?auto=format&fit=crop&w=800&q=80',likes:27800},
  {id:'007',title:'笑面人生',cat:'喜剧',rt:4.5,ep:'全36集',totalEp:36,author:'SMILE',cover:'https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?auto=format&fit=crop&w=800&q=80',likes:42000},
  {id:'008',title:'第七层梦境',cat:'悬疑',rt:4.3,ep:'第2集 / 共18集',totalEp:18,author:'DREAMER',cover:'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=800&q=80',likes:31500},
  {id:'009',title:'金融暗战',cat:'金融',rt:4.0,ep:'全44集',totalEp:44,author:'BULL',cover:'https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=800&q=80',likes:22000},
  {id:'010',title:'星际拓荒者',cat:'科幻',rt:4.7,ep:'全26集',totalEp:26,author:'STELLAR',cover:'https://images.unsplash.com/photo-1444723121867-7a241cacace9?auto=format&fit=crop&w=800&q=80',likes:48900}
];

var searchInput = document.getElementById('searchInput');
var searchClear = document.getElementById('searchClear');
var recentList = document.getElementById('recentList');
var clearRecent = document.getElementById('clearRecent');

/* Submit button */
document.getElementById('searchSubmit').addEventListener('click', function(){
  var q = searchInput.value.trim();
  if (q) {
    addRecent(q);
    location.href = 'search-results.html?q=' + encodeURIComponent(q);
  }
});

/* Input events */
searchInput.addEventListener('input', function(){
  searchClear.classList.toggle('show', this.value.length > 0);
});
searchClear.addEventListener('click', function(){
  searchInput.value = '';
  searchClear.classList.remove('show');
  searchInput.focus();
});
searchInput.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && this.value.trim()) {
    var q = this.value.trim();
    addRecent(q);
    location.href = 'search-results.html?q=' + encodeURIComponent(q);
  }
});

/* Recent searches */
function getRecent(){ try { return JSON.parse(localStorage.getItem('sf_recent')||'[]'); } catch(e){ return []; } }
function setRecent(arr){ localStorage.setItem('sf_recent', JSON.stringify(arr.slice(0,10))); }
function addRecent(q){
  var arr = getRecent().filter(function(x){ return x !== q; });
  arr.unshift(q);
  setRecent(arr);
}
function renderRecent(){
  var arr = getRecent();
  if (arr.length === 0) {
    document.getElementById('recentSection').style.display = 'none';
    return;
  }
  document.getElementById('recentSection').style.display = 'block';
  recentList.innerHTML = arr.map(function(q){
    return '<div class="recent-item" data-q="'+q+'"><div class="ri-left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>'+q+'</div><button class="ri-del">✕</button></div>';
  }).join('');
  recentList.querySelectorAll('.recent-item').forEach(function(el){
    el.addEventListener('click', function(e){
      if (e.target.closest('.ri-del')) return;
      location.href = 'search-results.html?q=' + encodeURIComponent(this.dataset.q);
    });
    el.querySelector('.ri-del').addEventListener('click', function(e){
      e.stopPropagation();
      var q = el.dataset.q;
      var arr = getRecent().filter(function(x){ return x !== q; });
      setRecent(arr);
      renderRecent();
    });
  });
}
clearRecent.addEventListener('click', function(){
  setRecent([]);
  renderRecent();
});
renderRecent();
</script>
<script src="load-sidebar.js"></script>
<script src="load-desktop-header.js?v=3"></script>
</body>
</html>
