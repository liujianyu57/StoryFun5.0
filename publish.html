<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story.fun | 发布新短剧</title>
  <style>
    :root {
      --bg: #f5faff;
      --surface: #ffffff;
      --accent: #000000;
      --accent-soft: rgba(0, 0, 0, 0.12);
      --accent-glow: rgba(0, 0, 0, 0.25);
      --text: #13202e;
      --text-muted: #5e6f83;
      --border: #deeaf7;
      --shadow-sm: 0 4px 12px rgba(27, 45, 71, 0.06);
      --shadow-md: 0 12px 28px rgba(27, 45, 71, 0.07);
      --shadow-lg: 0 20px 45px rgba(27, 45, 71, 0.10);
      --radius: 24px;
      --radius-lg: 32px;
      --danger: #f45b69;
      --warning: #ff9f2c;
      font-family: "PingFang SC", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); scroll-behavior: smooth; }
    @media (min-width: 769px) { body { padding-top: 56px; } }
    .app-shell { max-width: 1440px; margin: 0 auto; padding: 24px; }
    .nav-link.active { color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px rgba(0, 0, 0,0.15); }

    /* ===== Auth Styles ===== */
    .auth-container { display: flex; align-items: center; }
    .auth-login-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; white-space: nowrap; }
    .auth-login-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .auth-login-icon { font-size: 1rem; }
    .auth-user-menu { position: relative; }
    .auth-avatar { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; cursor: pointer; border: 2px solid var(--accent-soft); transition: border-color 0.2s; position: relative; flex-shrink: 0; }
    .auth-avatar:hover { border-color: var(--accent); }
    .auth-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .auth-avatar-dot { display: none; }
    .auth-dropdown { position: absolute; top: calc(100% + 10px); right: 0; width: 240px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 12px 40px rgba(27,45,71,0.15); opacity: 0; visibility: hidden; transform: translateY(-8px); transition: all 0.25s ease; z-index: 100; overflow: hidden; }
    .auth-dropdown.active { opacity: 1; visibility: visible; transform: translateY(0); }
    .auth-dropdown-header { display: flex; align-items: center; gap: 12px; padding: 16px 18px; }
    .auth-dropdown-header img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .auth-dropdown-name { font-weight: 600; font-size: 0.92rem; color: var(--text); }
    .auth-dropdown-divider { height: 1px; background: var(--border); margin: 0; }
    .auth-dropdown-item { display: flex; align-items: center; gap: 10px; padding: 12px 18px; color: var(--text); text-decoration: none; font-size: 0.9rem; transition: background 0.15s; cursor: pointer; }
    .auth-dropdown-item:hover { background: rgba(0,0,0,0.03); }
    .auth-dropdown-item span { font-size: 1.1rem; }
    .auth-dropdown-logout { color: #f45b69; }
    .auth-dropdown-logout:hover { background: rgba(244,91,105,0.06); }
    /* Login Modal */
    .auth-modal-overlay { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(15,23,42,0.4); backdrop-filter: blur(4px); opacity: 0; visibility: hidden; transition: all 0.3s ease; }
    .auth-modal-overlay.active { opacity: 1; visibility: visible; }
    .auth-modal { background: var(--surface); border-radius: 28px; width: 100%; max-width: 420px; box-shadow: 0 40px 80px rgba(27,45,71,0.2); overflow: hidden; transform: scale(0.95) translateY(10px); transition: transform 0.3s ease; }
    .auth-modal-overlay.active .auth-modal { transform: scale(1) translateY(0); }
    .auth-modal-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 50%; border: none; background: rgba(0,0,0,0.04); cursor: pointer; display: grid; place-items: center; font-size: 1.1rem; color: var(--text-muted); transition: all 0.2s; z-index: 1; }
    .auth-modal-close:hover { background: rgba(0,0,0,0.08); color: var(--text); }
    .auth-modal-header { text-align: center; padding: 36px 28px 20px; position: relative; }
    .auth-modal-logo { width: 56px; height: 56px; border-radius: 50%; background: #000000; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 1.3rem; margin: 0 auto 16px; box-shadow: 0 4px 16px rgba(0, 0, 0,0.3); }
    .auth-modal-header h2 { margin: 0 0 6px; font-size: 1.4rem; }
    .auth-modal-header p { margin: 0; color: var(--text-muted); font-size: 0.92rem; }
    .auth-modal-body { padding: 8px 28px 32px; display: flex; flex-direction: column; gap: 12px; }
    .auth-social-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; border-radius:999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .auth-social-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
    .auth-social-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-divider { display: flex; align-items: center; gap: 12px; color: var(--text-muted); font-size: 0.85rem; margin: 4px 0; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .auth-modal-tos { text-align: center; color: var(--text-muted); font-size: 0.82rem; line-height: 1.6; margin: 4px 0 0; }
    .auth-modal-tos a { color: var(--accent); text-decoration: none; }
    .auth-modal-tos a:hover { text-decoration: underline; }
    .auth-toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-100px); z-index: 10000; background: rgba(26,35,47,0.95); backdrop-filter: blur(8px); color: #fff; padding: 14px 24px; border-radius: 14px; font-size: 0.92rem; box-shadow: 0 12px 40px rgba(27,45,71,0.25); transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease; opacity: 0; pointer-events: none; max-width: 400px; text-align: center; font-weight: 500; }
    .auth-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    /* ===== End Auth Styles ===== */

    /* Page Header */
    .page-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-top: 16px; margin-bottom: 32px; }

    /* 桌面端隐藏移动端导航栏 */
    .step-nav-bar, .close-dropdown { display: none; }
    .page-header h2 { font-size: 2rem; letter-spacing: -0.02em; }
    .page-header a { text-decoration: none; color: var(--text-muted); font-weight: 600; font-size: 0.95rem; transition: color 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .page-header a:hover { color: var(--accent); }

    /* Steps Bar - Figma style numbered circles */
    .steps-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; padding: 12px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; box-shadow: var(--shadow-sm); overflow-x: auto; }
    .step-item { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .step-item .step-circle { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 0.85rem; font-weight: 700; background: rgba(0,0,0,0.05); color: var(--text-muted); transition: all 0.3s ease; flex-shrink: 0; }
    .step-item .step-label { font-size: 0.88rem; font-weight: 500; color: var(--text-muted); transition: color 0.3s ease; }
    .step-item.active .step-circle { background: #13202e; color: #fff; }
    .step-item.active .step-label { color: #13202e; font-weight: 600; }
    .step-item.done .step-circle { background: var(--accent); color: #fff; }
    .step-item.done .step-label { color: var(--accent); }
    .step-item.inactive .step-circle { background: #e5e5e5; color: #8b8d98; }
    .step-item.inactive .step-label { color: #60646c; }

    /* Form Panel */
    .form-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); overflow: hidden; }
    .form-panel-header { padding: 28px 32px 20px; border-bottom: 1px solid var(--border); }
    .form-panel-header h3 { font-size: 1.5rem; margin-bottom: 8px; }
    .form-panel-header p { color: var(--text-muted); font-size: 0.96rem; line-height: 1.7; }
    .form-panel-body { padding: 28px 32px 32px; }
    .form-panel-footer { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; padding: 20px 32px; border-top: 1px solid var(--border); background: #fafcff; }

    /* Form Elements */
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .form-row.full { grid-template-columns: 1fr; }
    .form-row.three { grid-template-columns: 1fr 1fr 1fr; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.92rem; font-weight: 600; color: var(--text); }
    .form-group label .hint { font-weight: 400; color: var(--text-muted); font-size: 0.88rem; }
    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group input[type="url"],
    .form-group select,
    .form-group textarea {
      padding: 12px 16px; border: 1px solid var(--border); border-radius: 14px; font-size: 0.95rem; font-family: inherit; background: var(--surface); color: var(--text); outline: none; transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .form-group textarea { min-height: 100px; resize: vertical; }
    .form-group .char-count { text-align: right; font-size: 0.85rem; color: var(--text-muted); }

    /* Cover upload */
    .cover-upload { position: relative; border: 2px dashed var(--border); border-radius:999px; padding: 40px 24px; text-align: center; cursor: pointer; transition: all 0.3s ease; background: #f8fbff; }
    .cover-upload:hover { border-color: var(--accent); background: var(--accent-soft); }
    .cover-upload .upload-icon { color: var(--text-muted); margin-bottom: 12px; display: flex; align-items: center; justify-content: center; }
    .cover-upload .upload-icon svg { width: 40px; height: 40px; }
    .cover-upload p { color: var(--text-muted); font-size: 0.95rem; }
    .cover-upload p strong { color: var(--accent); }

    /* ==== Batch Video Upload Styles ==== */
    .batch-upload-zone { position: relative; border: 2px dashed var(--border); border-radius:999px; padding: 28px 24px; text-align: center; cursor: pointer; transition: all 0.3s ease; background: #f8fbff; margin-bottom: 24px; }

    .batch-upload-zone:hover,
    .batch-upload-zone.drag-over { border-color: var(--accent); background: var(--accent-soft); }
    .batch-upload-zone .upload-icon { font-size: 3rem; color: var(--text-muted); margin-bottom: 12px; }
    .batch-upload-zone p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.7; }
    .batch-upload-zone p strong { color: var(--accent); }
    .batch-upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .batch-upload-hint { display: flex; justify-content: center; gap: 24px; margin-top: 12px; flex-wrap: wrap; }
    .batch-upload-hint span { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }

    /* Upload Queue */
    .upload-queue { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .upload-queue-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
    .upload-queue-header h4 { font-size: 1rem; font-weight: 600; }
    .upload-queue-header .queue-count { color: var(--text-muted); font-size: 0.88rem; }
    .upload-queue-empty { text-align: center; padding: 32px 16px; color: var(--text-muted); font-size: 0.95rem; }

    /* Upload Item */
    .upload-item { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border: 1px solid var(--border); border-radius:999px; background: #fafcff; transition: all 0.2s ease; }
    .upload-item:hover { border-color: rgba(0, 0, 0,0.25); box-shadow: 0 2px 8px rgba(0, 0, 0,0.06); }
    .upload-item .thumb { width: 48px; height: 48px; border-radius:999px; background: rgba(0,0,0,0.04); display: grid; place-items: center; font-size: 1.4rem; flex-shrink: 0; overflow: hidden; position: relative; }
    .upload-item .thumb video,
    .upload-item .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius:999px; }
    .upload-item .thumb .file-type-badge { position: absolute; bottom: 2px; right: 2px; font-size: 0.6rem; background: rgba(0,0,0,0.6); color: #fff; padding: 1px 5px; border-radius:999px; line-height: 1.4; }
    .upload-item .info { flex: 1; min-width: 0; }
    .upload-item .info .name { font-size: 0.95rem; font-weight: 600; display: flex; flex-direction: column; align-items: stretch; gap: 0; }
    .upload-item .info .meta { font-size: 0.82rem; color: var(--text-muted); margin-top: 3px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .upload-item .info .progress-bar { width: 100%; height: 4px; background: var(--border); border-radius: 999px; margin-top: 8px; overflow: hidden; }
    .upload-item .info .progress-bar .progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.3s ease; width: 0%; }
    .upload-item .info .progress-bar .progress-fill.error { background: var(--danger); }
    .upload-item .info .progress-bar .progress-fill.paused { background: var(--warning); }
    .upload-item .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .upload-item .status-badge { font-size: 0.75rem; padding: 3px 10px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
    .upload-item .status-badge.uploading { background: rgba(0, 0, 0,0.1); color: var(--accent); }
    .upload-item .status-badge.done { background: rgba(34,197,94,0.1); color: #16a34a; }
    .upload-item .status-badge.failed { background: rgba(244,91,105,0.1); color: var(--danger); }
    .upload-item .status-badge.waiting { background: rgba(255,159,44,0.1); color: var(--warning); }

    /* Episode Title Editor Inline */
    .upload-item .title-edit { display: flex; align-items: center; gap: 6px; }
    .upload-item .title-edit input { padding: 4px 10px; border: 1px solid var(--border); border-radius:999px; font-size: 0.85rem; font-family: inherit; outline: none; width: 220px; transition: border-color 0.2s; background: var(--surface); }
    .upload-item .title-edit input:placeholder-shown { border-style: dashed; border-color: rgba(0,0,0,0.2); }
    .upload-item .title-edit input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

    /* Batch toolbar */
    .batch-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 16px 0; margin-top: 4px; }
    .batch-toolbar .btn-tool { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.88rem; font-weight: 500; cursor: pointer; transition: all 0.2s ease; }
    .batch-toolbar .btn-tool:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .batch-toolbar .btn-tool.danger:hover { border-color: var(--danger); color: var(--danger); background: rgba(244,91,105,0.06); }
    .batch-toolbar .btn-tool:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Video Preview Modal */
    .video-preview-overlay { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); opacity: 0; visibility: hidden; transition: all 0.3s ease; padding: 24px; }
    .video-preview-overlay.active { opacity: 1; visibility: visible; }
    .video-preview-overlay .preview-close { position: absolute; top: 20px; right: 20px; width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(255,255,255,0.15); color: #fff; font-size: 1.4rem; cursor: pointer; display: grid; place-items: center; transition: background 0.2s; z-index: 10; }
    .video-preview-overlay .preview-close:hover { background: rgba(255,255,255,0.25); }
    .video-preview-overlay .preview-container { width: 100%; max-width: 900px; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); background: #000; transform: scale(0.9); transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); }
    .video-preview-overlay.active .preview-container { transform: scale(1); }
    .video-preview-overlay .preview-container video { width: 100%; display: block; max-height: 80vh; outline: none; }
    .video-preview-overlay .preview-info { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: rgba(0,0,0,0.6); color: #fff; font-size: 0.92rem; }
    .video-preview-overlay .preview-info .preview-title { font-weight: 600; }
    .video-preview-overlay .preview-info .preview-close-btn { background: none; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 16px; border-radius: 999px; cursor: pointer; font-size: 0.85rem; transition: background 0.2s; }
    .video-preview-overlay .preview-info .preview-close-btn:hover { background: rgba(255,255,255,0.1); }

    /* Sortable dragging */
    .upload-item.dragging { opacity: 0.4; border-color: var(--accent); }
    .upload-item.drag-over-target { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .drag-handle { cursor: grab; color: var(--text-muted); font-size: 1rem; user-select: none; }
    .drag-handle:active { cursor: grabbing; }

    /* Episode number on the far left */
    .upload-item .episode-num { width: 28px; text-align: center; font-weight: 700; font-size: 0.95rem; color: var(--accent); flex-shrink: 0; }

    /* Tags / Genres */
    .tag-options { display: flex; flex-wrap: wrap; gap: 10px; }
    .tag-option { padding: 8px 18px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: all 0.2s ease; }
    .tag-option:hover { border-color: var(--accent); color: var(--accent); }
    .tag-option.selected { background: var(--accent); color: #fff; border-color: transparent; }

    /* ===== Character Card Grid (Step 3 - Figma Inspired) ===== */
    .char-panel-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 0 16px; border-bottom: 2px solid var(--accent); margin-bottom: 24px; }
    .char-panel-header h3 { font-size: 1.25rem; font-weight: 700; color: var(--text); margin: 0; }
    .char-add-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 18px; border-radius: 999px; border: none; background: var(--accent-soft); color: var(--accent); font-size: 0.92rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; white-space: nowrap; }
    .char-add-btn:hover { background: rgba(0, 0, 0,0.2); }
    .char-add-btn .plus-icon { font-size: 1.1rem; line-height: 1; }

    .char-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; margin-bottom: 28px; }

    .char-card { position: relative; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--surface); transition: all 0.25s ease; display: flex; flex-direction: column; min-width: 0; }
    .char-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .char-card .char-avatar-area { position: relative; width: 100%; aspect-ratio: 1 / 1; background: linear-gradient(135deg, #e8f5ef, #d4ece5); overflow: hidden; flex-shrink: 0; z-index: 1; }
    .char-card .char-avatar-area img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .char-card .char-avatar-area .char-avatar-placeholder { width: 100%; height: 100%; display: grid; place-items: center; font-size: 2rem; color: var(--accent); }
    .char-card .char-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
    .char-card .char-body .char-name { font-size: 0.85rem; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .char-card .char-body .char-salary { font-size: 0.78rem; font-weight: 700; color: var(--accent); white-space: nowrap; }
    .char-card .char-remove-btn { margin-top: 6px; width: 100%; padding: 7px 0; border-radius:999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; font-family: inherit; }
    .char-card .char-remove-btn:hover { border-color: var(--danger); color: var(--danger); background: rgba(244,91,105,0.06); }

    .char-card.add-card { border: 2px dashed var(--border); background: transparent; display: grid; place-items: center; cursor: pointer; transition: all 0.25s ease; }
    .char-card.add-card:hover { border-color: var(--accent); background: var(--accent-soft); }
    .char-card.add-card .add-card-content { text-align: center; padding: 24px; }
    .char-card.add-card .add-card-content .add-icon { font-size: 2.4rem; color: var(--text-muted); }
    .char-card.add-card .add-card-content p { color: var(--text-muted); font-size: 0.95rem; }
    .char-card.add-card .add-card-content p strong { color: var(--accent); }

    /* Character Edit Modal */
    .char-modal-overlay { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(15,23,42,0.4); backdrop-filter: blur(4px); opacity: 0; visibility: hidden; transition: all 0.3s ease; }
    .char-modal-overlay.active { opacity: 1; visibility: visible; }
    .char-modal { background: var(--surface); border-radius: 28px; width: 100%; max-width: 480px; box-shadow: 0 40px 80px rgba(27,45,71,0.2); overflow: hidden; transform: scale(0.95) translateY(10px); transition: transform 0.3s ease; }
    .char-modal-overlay.active .char-modal { transform: scale(1) translateY(0); }

    .char-modal-body { padding: 8px 28px 24px; display: flex; flex-direction: column; gap: 16px; }

    .char-modal-body .form-group textarea { padding: 12px 16px; border: 1px solid var(--border); border-radius: 14px; font-size: 0.95rem; font-family: inherit; background: var(--surface); color: var(--text); outline: none; transition: border-color 0.2s ease; width: 100%; }
    .char-modal-body .form-group input:focus,
    .char-modal-body .form-group textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .char-modal-body .form-group textarea { min-height: 80px; resize: vertical; }
    .char-modal-body .char-avatar-upload { display: flex; align-items: center; gap: 16px; }
    .char-modal-body .char-avatar-upload .avatar-preview { width: 64px; height: 64px; border-radius: 50%; background: #f0f4f8; display: grid; place-items: center; font-size: 1.6rem; color: var(--text-muted); overflow: hidden; flex-shrink: 0; }

    .char-modal-footer { display: flex; justify-content: flex-end; gap: 12px; padding: 16px 28px 24px; }

    /* ===== Actor Bind Modal ===== */
    .actor-bind-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-height: 360px; overflow-y: auto; padding: 4px; }
    .actor-bind-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 14px; cursor: pointer; transition: all 0.18s ease; background: var(--surface); position: relative; }

    .char-bind-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 10px 14px; border-radius:999px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-size: 0.92rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; white-space: nowrap; }

    /* ===== End Character Card Grid ===== */

    /* ===== Pricing & Revenue (Figma Style) ===== */
    .pricing-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 32px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 32px; }

    /* Buttons */
    .button, .button-secondary, .button-ghost, .button-outline { border: none; cursor: pointer; border-radius: 999px; padding: 12px 24px; font-size: 0.95rem; transition: all 0.25s ease; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }

<script>
/**
 * Submit for review - navigate to narrator center
 */
function submitForReview() {
  const toast = document.createElement('div');
  toast.textContent = '✅ 发布成功';
  Object.assign(toast.style, {
    position: 'fixed', top: '50%', left: '50%',
    transform: 'translate(-50%, -50%)',
    background: 'rgba(26,35,47,0.92)', backdropFilter: 'blur(8px)',
    color: '#fff', padding: '16px 32px', borderRadius: '16px',
    fontSize: '1rem', boxShadow: '0 12px 40px rgba(27,45,71,0.3)',
    zIndex: '10000', fontWeight: '600',
  });
  document.body.appendChild(toast);
  setTimeout(() => {
    history.back();
  }, 800);
}

/**
 * Step Navigation
 */
function goToStep(num) {
  const steps = ['step1','step2'];
  const stepTitles = ['基本信息', '剧集管理'];

  // Show/hide panels
  const stepItems = document.querySelectorAll('.step-item');
  steps.forEach((id, i) => {
    document.getElementById(id).style.display = i + 1 === num ? 'block' : 'none';
    const item = stepItems[i];
    if (!item) return;
    item.classList.remove('active', 'done', 'inactive');
    if (i + 1 < num) {
      item.classList.add('done');
    } else if (i + 1 === num) {
      item.classList.add('active');
    } else {
      item.classList.add('inactive');
    }
  });

  // Update navigation bar (mobile)
  var titleEl = document.getElementById('stepNavTitle');
  var leftBtn = document.getElementById('stepNavLeft');
  var rightBtn = document.getElementById('stepNavRight');

  if (titleEl) titleEl.textContent = stepTitles[num - 1];

  if (leftBtn) {
    if (num === 1) {
      leftBtn.style.visibility = 'visible';
      leftBtn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      leftBtn.onclick = function(e) {
        e.stopPropagation();
        var dd = document.getElementById('closeDropdown');
        dd.classList.toggle('active');
      };
    } else {
      leftBtn.style.visibility = 'visible';
      leftBtn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      leftBtn.onclick = function() { goToStep(num - 1); };
    }
  }


  if (rightBtn) {
    if (num === 2) {
      rightBtn.innerHTML = '<span>发布</span>';
      rightBtn.onclick = function() { submitForReview(); };
    } else {
      rightBtn.innerHTML = '<span>下一步</span>';
      rightBtn.onclick = function() { goToStep(num + 1); };
    }
  }
}


/**
 * Batch Video Upload Engine
 */
const batchUpload = {
  files: [],
  idCounter: 0,
  isUploading: false,

  init() {
    const zone = document.getElementById('batchUploadZone');
    const input = document.getElementById('videoFileInput');

    zone.addEventListener('click', (e) => {
      if (e.target.tagName !== 'INPUT') input.click();
    });

    input.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        this.addFiles(e.target.files);
        input.value = '';
      }
    });

    zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      if (e.dataTransfer.files.length > 0) this.addFiles(e.dataTransfer.files);
    });

    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => e.preventDefault());
  },

  addFiles(fileList) {
    const validFiles = [];
    const maxSize = 3 * 1024 * 1024 * 1024;

    for (const file of fileList) {
      const isVideo = file.type.startsWith('video/') || /\.(mp4|flv|wmv|asf|mkv|avi|rm|rmvb|mpg|mpeg|mov|webm)$/i.test(file.name);
      if (!isVideo) {
        this.showToast(`"${file.name}" 不是视频文件，已跳过`);
        continue;
      }
      if (file.size > maxSize) {
        this.showToast(`"${file.name}" 超过 3GB 限制，已跳过`);
        continue;
      }

      validFiles.push(file);
    }

    if (validFiles.length === 0) return;

    validFiles.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN', { numeric: true }));

    const newItems = validFiles.map(file => ({
      id: ++this.idCounter,
      file,
      name: file.name.replace(/\.[^/.]+$/, ''),
      originalName: file.name,
      size: file.size,
      type: file.type,
      title: '',
      order: this.files.length + 1,
      status: 'waiting',
      progress: 0,
      url: null,
      duration: null,
      thumbUrl: null,
    }));

    newItems.forEach((item, i) => { item.order = this.files.length + i + 1; });
    this.files = this.files.concat(newItems);

    // Generate thumbnails asynchronously
    newItems.forEach(item => this.generateThumbnail(item.file, item.id));

    this.render();
    this.showToast(`已添加 ${newItems.length} 个视频文件`);
    // Auto-upload all waiting files
    this.startAllUpload();
  },

  removeFile(id) {
    const file = this.files.find(f => f.id === id);
    if (!file) return;
    if (!confirm(`确定要删除第 ${file.order} 集"${file.title || file.name}"吗？`)) return;
    this.files = this.files.filter(f => f.id !== id);
    this.reorder();
    this.render();
  },


  removeAll() {
    if (this.files.length === 0) return;
    if (!confirm('确定要清空所有已添加的视频吗？')) return;
    this.files = [];
    this.render();
  },

  reorder() {
    this.files.forEach((f, i) => f.order = i + 1);
  },

  sortByName() {
    this.files.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN', { numeric: true }));
    this.reorder();
    this.render();
  },

  setTitle(id, title) {
    const file = this.files.find(f => f.id === id);
    if (file) file.title = title;
  },

  replaceFile(id) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'video/mp4,video/quicktime,video/x-msvideo,video/*';
    input.style.display = 'none';
    input.addEventListener('change', (e) => {
      if (e.target.files.length === 0) return;
      const file = e.target.files[0];
      const isVideo = file.type.startsWith('video/') || /\.(mp4|flv|wmv|asf|mkv|avi|rm|rmvb|mpg|mpeg|mov|webm)$/i.test(file.name);
      if (!isVideo) { this.showToast(`"${file.name}" 不是视频文件`); return; }
      if (file.size > 3 * 1024 * 1024 * 1024) { this.showToast(`"${file.name}" 超过 3GB 限制`); return; }

      const item = this.files.find(f => f.id === id);
      if (!item) return;
      item.file = file;
      item.name = file.name.replace(/\.[^/.]+$/, '');
      item.originalName = file.name;
      item.size = file.size;
      item.type = file.type;
      item.status = 'waiting';
      item.progress = 0;
      item.url = null;
      item.thumbUrl = null;
      item.duration = null;
      this.generateThumbnail(file, id);
      this.render();
      this.showToast(`已替换为 "${file.name}"`);
      this.startAllUpload();
    });
    document.body.appendChild(input);
    input.click();
    setTimeout(() => input.remove(), 1000);
  },

  openPreview(id) {
    const item = this.files.find(f => f.id === id);
    if (!item || !item.url) {
      this.showToast('视频尚未准备好，请等待上传完成');
      return;
    }
    const overlay = document.getElementById('videoPreviewOverlay');
    const video = document.getElementById('previewVideo');
    const title = document.getElementById('previewTitle');
    title.textContent = `第 ${item.order} 集：${item.title || item.name}`;
    video.src = item.url;
    overlay.classList.add('active');
  },

  closePreview() {
    const overlay = document.getElementById('videoPreviewOverlay');
    const video = document.getElementById('previewVideo');
    overlay.classList.remove('active');
    video.pause();
    video.removeAttribute('src');
    video.load();
  },

  formatSize(bytes) {
    if (bytes === 0) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
  },

  formatDuration(seconds) {
    if (!seconds) return '';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
  },

  generateThumbnail(file, id) {
    const video = document.createElement('video');
    video.preload = 'metadata';
    video.muted = true;
    video.playsInline = true;

    video.onloadeddata = () => {
      const item = this.files.find(f => f.id === id);
      if (item) {
        item.duration = video.duration || null;
      }
      const canvas = document.createElement('canvas');
      canvas.width = 160;
      canvas.height = 90;
      canvas.getContext('2d').drawImage(video, 0, 0, 160, 90);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
      if (item) item.thumbUrl = dataUrl;
      this.renderThumbnail(id, dataUrl);
      this.renderItem(item);
      this.updateStats();
      video.remove();
      URL.revokeObjectURL(video.src);
    };
    video.onerror = () => { video.remove(); URL.revokeObjectURL(video.src); };
    video.src = URL.createObjectURL(file);
    video.currentTime = 1;
  },


  renderThumbnail(id, dataUrl) {
    const el = document.querySelector(`[data-file-id="${id}"] .thumb`);
    if (!el) return;
    const img = document.createElement('img');
    img.src = dataUrl;
    img.alt = '';
    const badge = el.querySelector('.file-type-badge');
    el.innerHTML = '';
    el.appendChild(img);
    if (badge) el.appendChild(badge);
  },

  async uploadFile(item) {
    if (item.status === 'done' || item.status === 'uploading') return;
    item.status = 'uploading';
    item.progress = 0;
    item.uploadedBytes = 0;
    this.renderItem(item);

    const totalSteps = 20;
    for (let i = 1; i <= totalSteps; i++) {
      await new Promise(r => setTimeout(r, 120 + Math.random() * 180));
      const pct = Math.min(i / totalSteps, 0.99);
      item.progress = Math.round(pct * 100);
      item.uploadedBytes = Math.round(item.size * pct);
      this.renderItemProgress(item);
    }

    item.status = 'done';
    item.progress = 100;
    item.uploadedBytes = item.size;
    item.url = URL.createObjectURL(item.file);
    this.renderItem(item);
    this.updateStats();
  },


  async startAllUpload() {
    const pending = this.files.filter(f => f.status === 'waiting' || f.status === 'failed');
    if (pending.length === 0) { this.showToast('所有文件已上传完成'); return; }

    this.isUploading = true;

    for (const item of pending) {
      await this.uploadFile(item);
    }

    this.isUploading = false;
    this.showToast('全部上传完成！');
  },

  retryUpload(id) {
    const item = this.files.find(f => f.id === id);
    if (item && item.status === 'failed') { item.progress = 0; this.uploadFile(item); }
  },

  updateStats() {
    const total = this.files.length;
    const done = this.files.filter(f => f.status === 'done').length;
    const failed = this.files.filter(f => f.status === 'failed').length;
    const el = document.getElementById('uploadStats');
    if (total === 0) { el.textContent = ''; }
    else if (done === total) { el.textContent = `✅ ${done}/${total} 上传完成`; }
    else {
      let text = `📊 ${done}/${total} 上传完成`;
      if (failed > 0) text += `, ⚠️ ${failed} 失败`;
      el.textContent = text;
    }
  },


  render() {
    const container = document.getElementById('queueItems');
    const queueEl = document.getElementById('uploadQueue');
    const emptyEl = document.getElementById('queueEmpty');
    const toolbar = document.getElementById('batchToolbar');
    const countEl = document.getElementById('queueCount');

    if (this.files.length === 0) {
      queueEl.style.display = 'none';
      emptyEl.style.display = 'block';
      toolbar.style.display = 'none';
      return;
    }

    queueEl.style.display = 'block';
    emptyEl.style.display = 'none';
    toolbar.style.display = 'flex';
    countEl.textContent = `(${this.files.length} 个文件)`;
    container.innerHTML = this.files.map(item => this.renderItemHTML(item)).join('');
    this.updateStats();
  },

  renderItemHTML(item) {
    const statusText = { waiting: '等待上传', uploading: '上传中', done: '上传完成', failed: '上传失败' };

    const statusClass = item.status;
    const episodeNum = item.order;
    const ext = item.originalName.split('.').pop().toUpperCase();

    const thumbContent = item.thumbUrl
      ? `<img src="${item.thumbUrl}" alt="" /><span class="file-type-badge">${ext}</span>`
      : `<span style="font-size:1.6rem;">🎬</span><span class="file-type-badge">${ext}</span>`;

    const progressHTML = (item.status === 'uploading')
      ? `<div class="progress-bar"><div class="progress-fill" style="width:${item.progress}%"></div></div>`
      : (item.status === 'done')
        ? `<div class="progress-bar"><div class="progress-fill" style="width:100%;background:#16a34a;"></div></div>`
        : (item.status === 'failed')
          ? `<div class="progress-bar"><div class="progress-fill error" style="width:100%"></div></div>`
          : '';

    const progressText = (item.status === 'uploading')
      ? `<span class="progress-text">${this.formatSize(item.uploadedBytes || 0)} / ${this.formatSize(item.size)}</span>`
      : '';

    const isPlayable = item.status === 'done' && item.url;
    const playAttr = isPlayable ? ' style="cursor:pointer;" onclick="batchUpload.openPreview(' + item.id + ')"' : '';

    return `<div class="upload-item" data-file-id="${item.id}"${playAttr}>
      <span class="episode-num">${episodeNum}</span>
      <div class="thumb">
        ${thumbContent}
        ${isPlayable ? '<span style="position:absolute;inset:0;display:grid;place-items:center;font-size:1.2rem;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.6);">▶</span>' : ''}
      </div>
      <div class="info">
        <div class="name">
          <span style="font-size:0.78rem;color:var(--text-muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px;">${this.escapeHtml(item.originalName)}</span>
        </div>
        <div class="meta">
          <span class="file-size">${this.formatSize(item.size)}</span>
          ${item.duration ? `<span class="duration">⏱ ${this.formatDuration(item.duration)}</span>` : ''}
          ${progressText}
          <span class="status-badge ${statusClass}" onclick="event.stopPropagation()">${statusText[item.status]}</span>
        </div>

        ${progressHTML}
        <span class="title-edit"><input type="text" value="${this.escapeHtml(item.title || '')}" placeholder="分集描述" onclick="event.stopPropagation()" onchange="batchUpload.setTitle(${item.id}, this.value)" /></span>
      </div>

      <div class="item-actions" onclick="event.stopPropagation()">
        ${item.status === 'failed' ? `<button class="btn-icon" title="重试" onclick="batchUpload.retryUpload(${item.id})">↻</button>` : ''}
        <button class="btn-icon" title="替换视频" onclick="batchUpload.replaceFile(${item.id})">🔄</button>
        <button class="btn-icon danger" title="删除" onclick="batchUpload.removeFile(${item.id})">✕</button>
      </div>
    </div>`;
  },

  renderItem(item) {
    const el = document.querySelector(`[data-file-id="${item.id}"]`);
    if (el) el.outerHTML = this.renderItemHTML(item);
  },

  renderItemProgress(item) {
    const el = document.querySelector(`[data-file-id="${item.id}"]`);
    if (!el) return;
    const fill = el.querySelector('.progress-fill');
    const badge = el.querySelector('.status-badge');
    if (fill) fill.style.width = item.progress + '%';
    if (badge) { badge.className = 'status-badge uploading'; badge.textContent = '上传中'; }
    // Update progress text (uploaded size)
    const progressTextEl = el.querySelector('.progress-text');
    if (progressTextEl) {
      progressTextEl.textContent = `${this.formatSize(item.uploadedBytes || 0)} / ${this.formatSize(item.size)}`;
    } else {
      // Create progress text element if not exist
      const meta = el.querySelector('.meta');
      if (meta) {
        const pt = document.createElement('span');
        pt.className = 'progress-text';
        pt.textContent = `${this.formatSize(item.uploadedBytes || 0)} / ${this.formatSize(item.size)}`;
        meta.insertBefore(pt, meta.querySelector('.status-badge'));
      }
    }
  },


  escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  },

  showToast(msg) {
    const existing = document.querySelector('.batch-toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'batch-toast';
    toast.textContent = msg;
    Object.assign(toast.style, {
      position: 'fixed', bottom: '24px', left: '50%',
      transform: 'translateX(-50%) translateY(100px)',
      background: 'rgba(26,35,47,0.92)', backdropFilter: 'blur(8px)',
      color: '#fff', padding: '12px 24px', borderRadius: '14px',
      fontSize: '0.92rem', boxShadow: '0 8px 32px rgba(27,45,71,0.25)',
      zIndex: '10000', transition: 'transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease',
      opacity: '0', maxWidth: '400px', textAlign: 'center', fontWeight: '500',
    });
    document.body.appendChild(toast);
    requestAnimationFrame(() => { toast.style.transform = 'translateX(-50%) translateY(0)'; toast.style.opacity = '1'; });
    setTimeout(() => { toast.style.transform = 'translateX(-50%) translateY(100px)'; toast.style.opacity = '0'; setTimeout(() => toast.remove(), 400); }, 2500);
  },
};

document.addEventListener('DOMContentLoaded', () => {
  batchUpload.init();

  // 恢复上次未完成的草稿
  try {
    const draft = JSON.parse(localStorage.getItem('publish_draft') || 'null');
    if (draft && draft.from === 'publish') {
      localStorage.removeItem('publish_draft');
      const tEl = document.getElementById('pTitle');
      const dEl = document.getElementById('pDesc');
      if (draft.title && tEl) tEl.value = draft.title;
      if (draft.desc && dEl) dEl.value = draft.desc;
      if (draft.cover) {
        const zone = document.querySelector('.cover-upload');
        const zoneInput = zone ? zone.querySelector('input') : null;
        if (zone && draft.cover) {
          zone.innerHTML = '<div style="display:flex;align-items:center;gap:16px;justify-content:center;"><img src="' + draft.cover + '" style="width:100px;height:80px;border-radius:12px;object-fit:cover;border:1px solid var(--border);" /><div style="text-align:left;"><p style="color:var(--accent);font-weight:600;margin:0;font-size:0.95rem;">✅ 已恢复封面</p></div></div>';
          if (zoneInput) { zone.appendChild(zoneInput); }
        }
      }
      (draft.tags || []).forEach(tag => {
        document.querySelectorAll('#step1 .tag-option').forEach(el => {
          if (el.textContent.trim() === tag) el.classList.add('selected');
        });
      });
      batchUpload.showToast('已恢复草稿');
    }
  } catch (e) {}

  // Initialize step 1 navigation bar
  goToStep(1);

  // Close dropdown bindings
  var closeDontSave = document.getElementById('closeDontSave');
  var closeSaveDraft = document.getElementById('closeSaveDraft');
  var closeDropdown = document.getElementById('closeDropdown');

  if (closeDontSave) {
    closeDontSave.addEventListener('click', function(e) {
      e.stopPropagation();
      closeDropdown.classList.remove('active');
      history.back();
    });
  }

  if (closeSaveDraft) {
    closeSaveDraft.addEventListener('click', function(e) {
      e.stopPropagation();
      closeDropdown.classList.remove('active');
      batchUpload.showToast('草稿已保存！');
      setTimeout(function() { history.back(); }, 500);
    });
  }

  // Click outside to close dropdown
  document.addEventListener('click', function(e) {
    if (closeDropdown && closeDropdown.classList.contains('active')) {
      var leftBtn = document.getElementById('stepNavLeft');
      if (!closeDropdown.contains(e.target) && e.target !== leftBtn && !leftBtn.contains(e.target)) {
        closeDropdown.classList.remove('active');
      }
    }
  });
});
</script>
</body>
</html>
