<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的资产 · 发射台</title>
  <link rel="stylesheet" href="launch.css" />
  <style>
    /* ===== 我的资产 ===== */
    .as-hero { padding: 30px 0 4px; }
    .as-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .as-sub { font-size: 13px; color: var(--text-2); margin-top: 4px; }

    .as-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 20px 0 8px; }
    .as-stat { padding: 16px 18px; }
    .as-stat .k { font-size: 12px; color: var(--text-2); }
    .as-stat .v { font-size: 20px; font-weight: 800; margin-top: 4px; letter-spacing: -0.01em; }
    .as-stat .s { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .as-stat.total { background: var(--text); color: #fff; }
    .as-stat.total .k { color: rgba(255,255,255,.6); }
    .as-stat.total .s { color: rgba(255,255,255,.6); }
    .as-stat.total .v { font-size: 24px; }
    .as-stat.total .v.up { color: #3BE08A; }
    .as-stat.total .v.down { color: #FF7B8A; }
    .as-stat.total .s span.up { color: #3BE08A; }
    .as-stat.total .s span.down { color: #FF7B8A; }

    .as-tabs { display: flex; gap: 4px; margin: 22px 0 14px; border-bottom: 1px solid var(--border);
      overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .as-tab {
      border: none; background: none; padding: 10px 14px; font-size: 14px; font-weight: 600;
      color: var(--text-2); border-bottom: 2px solid transparent; margin-bottom: -1px;
      cursor: pointer; white-space: nowrap; font-family: inherit;
    }
    .as-tab.on { color: var(--text); border-bottom-color: var(--accent); }
    .as-tab .cnt { font-size: 11px; color: var(--text-3); margin-left: 5px; }

    .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .asset-card { display: flex; gap: 14px; padding: 14px; align-items: center; }
    .asset-cover { width: 64px; height: 64px; border-radius: 14px; overflow: hidden; background: var(--surface-2); flex-shrink: 0; position: relative; cursor: pointer; }
    .asset-cover img { width: 100%; height: 100%; object-fit: cover; }
    .asset-body { flex: 1; min-width: 0; }
    .asset-name { font-weight: 700; font-size: 14.5px; display: flex; gap: 6px; align-items: baseline; cursor: pointer; }
    .asset-name:hover { text-decoration: underline; }
    .asset-sub { font-size: 12px; color: var(--text-2); margin-top: 3px; }
    .asset-right { text-align: right; flex-shrink: 0; }
    .asset-right .v { font-weight: 700; font-size: 14px; }
    .asset-right .s { font-size: 11.5px; color: var(--text-2); margin-top: 3px; }
    .asset-btn {
      margin-top: 8px; height: 30px; padding: 0 12px; border-radius: 9px; font-size: 12.5px; font-weight: 600;
      border: 1px solid var(--accent); background: var(--accent); color: #fff;
    }
    .asset-btn.ghost { background: var(--surface); color: var(--text); border-color: var(--border); }
    .asset-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* 历史 */
    /* pons Positions（Open positions 列表行） */
    .pos-head { margin: 2px 0 14px; }
    .pos-title { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
    .pos-sub { font-size: 12px; color: var(--text-3); margin-top: 3px; }
    .pos-scroll { overflow-x: auto; }
    .pos-list { display: flex; flex-direction: column; gap: 8px; min-width: 780px; }
    .pos-row {
      display: grid; grid-template-columns: minmax(190px, 1.5fr) repeat(3, minmax(112px, .95fr)) minmax(128px, 1fr) 46px;
      gap: 8px; align-items: center; padding: 12px 16px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      cursor: pointer; transition: background .15s, border-color .15s;
    }
    .pos-row:hover { background: var(--surface-2); border-color: var(--border-strong); }
    .p-cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .p-token { display: flex; flex-direction: row; align-items: center; gap: 11px; }
    .p-logo { width: 42px; height: 42px; border-radius: 11px; overflow: hidden; background: var(--surface-2);
      display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none; color: var(--text-3); }
    .p-logo img { width: 100%; height: 100%; object-fit: cover; }
    .p-tt { min-width: 0; }
    .p-tt b { display: block; font-size: 13.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .p-tt i { display: block; font-style: normal; font-size: 11px; color: var(--text-3); font-weight: 600; }
    .p-claim { display: inline-block; margin-top: 5px; border: 1px solid var(--border); border-radius: 999px;
      background: var(--surface-2); color: var(--text-2); font-size: 10px; font-weight: 700; padding: 2px 9px; cursor: pointer; }
    .p-claim:hover { color: var(--text); border-color: var(--text-3); }
    .p-lab { font-size: 10.5px; color: var(--text-3); font-weight: 600; white-space: nowrap; }
    .p-val { font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .p-pnl .p-val { display: flex; align-items: center; gap: 5px; }
    .p-pnl .p-pct { font-size: 11px; font-weight: 600; color: var(--text-3); }
    .p-share-cell { display: flex; justify-content: flex-end; }
    .p-share { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text-2); cursor: pointer; display: grid; place-items: center; transition: all .15s; }
    .p-share:hover { color: var(--text); border-color: var(--text-3); background: var(--surface); }
    .p-share svg { width: 15px; height: 15px; }

    /* 分享弹层：HTML 分享卡（视觉近似分享图，不真实生成文件） */
    .share-overlay { position: fixed; inset: 0; z-index: 500; display: none; align-items: center; justify-content: center;
      background: rgba(10,11,13,.5); padding: 20px; }
    .share-overlay.open { display: flex; }
    .share-card { width: min(400px, 94vw); background: #fff; border-radius: 20px; padding: 16px;
      box-shadow: 0 24px 70px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 12px; }
    .share-head { display: flex; align-items: center; justify-content: space-between; }
    .share-head b { font-size: 14px; font-weight: 700; }
    .share-head button { width: 30px; height: 30px; border-radius: 50%; border: none; background: rgba(0,0,0,.06);
      color: #555; font-size: 14px; cursor: pointer; }
    .share-card .sv { background: #fff; border: 1px solid #F0F1F3; border-radius: 16px; padding: 20px 20px 14px;
      display: flex; flex-direction: column; gap: 16px; }
    .sv-head { display: flex; align-items: baseline; justify-content: space-between; }
    .sv-head .sv-k { font-size: 11px; font-weight: 700; letter-spacing: .02em; color: #8E8E93; }
    .sv-head .sv-brand { font-size: 11px; font-weight: 700; color: #0A0B0D; }
    .sv-mid { display: flex; align-items: center; gap: 12px; }
    .sv-logo { width: 52px; height: 52px; border-radius: 13px; overflow: hidden; background: #F4F5F7; flex: none;
      display: grid; place-items: center; font-size: 18px; font-weight: 800; color: #B9BEC4; }
    .sv-logo img { width: 100%; height: 100%; object-fit: cover; }
    .sv-tt b { display: block; font-size: 17px; font-weight: 800; }
    .sv-tt i { display: block; font-style: normal; font-size: 12px; color: #8E8E93; font-weight: 600; margin-top: 2px; }
    .sv-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .sv-stats > div { background: #F7F8FA; border-radius: 12px; padding: 10px 12px; min-width: 0; }
    .sv-stats label { display: block; font-size: 10px; color: #8E8E93; font-weight: 600; margin-bottom: 3px; }
    .sv-stats b { display: block; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sv-stats .up b { color: #0E9F6E; }
    .sv-stats .down b { color: #E5484D; }
    .sv-foot { text-align: center; font-size: 10px; color: #C7CBD0; }
    .share-actions { display: flex; gap: 10px; }
    .share-actions button { flex: 1; height: 42px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; }
    .share-actions .sv-copy { background: rgba(0,0,0,.06); color: #111; }
    .share-actions .sv-copy:hover { background: rgba(0,0,0,.12); }
    .share-actions .sv-down { background: #0A0B0D; color: #fff; }
    .share-actions .sv-down:hover { opacity: .88; }


    /* pons Launches / Activity 列表行 */
    .pl-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .pl-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 16px; cursor: pointer; text-decoration: none; color: inherit;
      transition: background .15s, border-color .15s; }
    .pl-row:hover { background: var(--surface-2); border-color: var(--border-strong); }
    .pl-logo { width: 40px; height: 40px; border-radius: 11px; overflow: hidden; background: var(--surface-2); flex: none;
      display: grid; place-items: center; font-weight: 700; font-size: 15px; color: var(--text-3); }
    .pl-logo img { width: 100%; height: 100%; object-fit: cover; }
    .pl-copy { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .pl-copy strong { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl-copy small { font-size: 11px; color: var(--text-3); font-weight: 600; font-variant-numeric: tabular-nums; }
    .pl-copy .ac-word.buy { color: var(--up); }
    .pl-copy .ac-word.sell { color: var(--down); }
    .pl-status { flex: none; display: flex; align-items: center; gap: 8px; }
    .pl-state { font-size: 12px; color: var(--text-3); font-weight: 600; white-space: nowrap; }
    .pl-claimbtn { border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); color: var(--text);
      font-size: 11px; font-weight: 700; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
    .pl-claimbtn:hover { border-color: var(--text); background: var(--surface); }
    .act-time { flex: none; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }

    .history-card { padding: 6px 18px 14px; }
    .his-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .his-row:last-child { border-bottom: none; }
    .his-side { width: 44px; font-weight: 700; }
    .his-side.buy { color: var(--up); }
    .his-side.sell { color: var(--down); }
    .his-coin { font-weight: 600; width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .his-pnl { font-size: 11.5px; font-weight: 700; width: 76px; text-align: right; flex-shrink: 0; }
    .his-mid { flex: 1; color: var(--text-2); text-align: right; }
    .his-time { color: var(--text-3); font-size: 11.5px; width: 40px; text-align: right; }

    /* AI 叙事回放 */
    .ai-card { padding: 14px; display: flex; gap: 12px; align-items: center; }
    .ai-thumb { width: 92px; height: 60px; border-radius: 10px; overflow: hidden; position: relative; cursor: pointer; background: var(--text); flex-shrink: 0; }
    .ai-thumb video { width: 100%; height: 100%; object-fit: cover; }
    .ai-thumb .pb { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; }

    /* ===== Profile 骨架（参考 pons Profile） ===== */
    /* Creator fees 横幅 + 演示状态按钮（pons：有 claimable 才显示） */
    .fees-banner { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin: 12px 0 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
    .fees-banner .fb-ic { width: 34px; height: 34px; border-radius: 50%; background: #0A0B0D; color: #fff;
      display: grid; place-items: center; font-size: 13px; flex: none; }
    .fees-banner .fb-txt { flex: 1; min-width: 0; }
    .fees-banner .fb-txt b { display: block; font-size: 13.5px; font-weight: 700; }
    .fees-banner .fb-txt small { display: block; font-size: 11.5px; color: var(--text-2); margin-top: 2px; font-variant-numeric: tabular-nums; }
    .fees-banner button { border: none; border-radius: 999px; background: var(--text); color: #fff; flex: none;
      font-size: 12.5px; font-weight: 700; padding: 8px 16px; cursor: pointer; white-space: nowrap; }
    .fees-banner button:hover { opacity: .9; }
    .pos-head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .fee-demo-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
      padding: 6px 12px; font-size: 11px; font-weight: 600; color: var(--text-2); cursor: pointer; white-space: nowrap; }
    .fee-demo-btn:hover { color: var(--text); border-color: var(--text-3); }
    .pl-state.ready { color: #0E9F6E; font-weight: 700; }
    .pl-state.claimed { color: var(--text-2); font-weight: 700; }
    .pf-visit { display: flex; align-items: center; gap: 10px; margin: 2px 0 14px; width: max-content;
      font-size: 12px; color: var(--text-2); background: var(--accent-soft); border: 1px solid var(--border);
      border-radius: 999px; padding: 6px 14px; }
    .pf-visit b { font-weight: 700; }
    .pf-visit a { color: var(--text); font-weight: 700; text-decoration: underline; margin-left: 4px; }
    .pf-hero { display: flex; flex-direction: column; gap: 16px; margin: 8px 0 16px; padding: 18px 20px 20px;
      border-radius: 22px; background: var(--surface); border: 1px solid var(--border); }
    .pf-id { display: flex; align-items: center; gap: 14px; min-width: 0; }
    /* 身份行右侧：跳转到个人内容主页 */
    .pf-id-link { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0;
      padding: 6px 10px; border-radius: 10px; font-size: 12.5px; font-weight: 700; letter-spacing: -0.01em;
      color: var(--text-2); text-decoration: none; transition: background .15s ease, color .15s ease; }
    .pf-id-link svg { width: 13px; height: 13px; }
    .pf-id-link:hover { background: var(--accent-soft); color: var(--text); }
    .pf-id-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .pf-avatar { width: 54px; height: 54px; border-radius: 50%; overflow: hidden; background: var(--text); color: #fff; display: grid; place-items: center; font-size: 20px; font-weight: 800; flex-shrink: 0; }
    .pf-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .pf-addr-row { display: flex; align-items: center; gap: 10px; min-width: 0; margin-top: 0; }
    .pf-addr { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--text);
      word-break: break-all; overflow-wrap: anywhere; line-height: 1.45; letter-spacing: .01em; }
    .pf-copy { border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); color: var(--text-2); font-size: 11px; font-weight: 700; padding: 3px 10px; cursor: pointer; font-family: inherit; }
    .pf-copy:hover { color: var(--text); border-color: var(--text-3); }
    /* 地址复制：图标按钮（与身份行同一行，更紧凑） */
    .pf-copy.ic { display: inline-grid; place-items: center; width: 28px; height: 28px; padding: 0; border-radius: 9px; flex-shrink: 0; }
    .pf-copy.ic svg { width: 15px; height: 15px; display: block; }

    /* 钱包条：ETH 余额（钱包资产，不计入 Portfolio 口径） */
    .pf-wallet { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px;
      padding-top: 16px; border-top: 1px dashed var(--border); }
    .pf-wallet-main { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0;
      padding: 2px 10px 2px 0; border: none; background: none; cursor: pointer; font-family: inherit; color: inherit;
      text-align: left; border-radius: 12px; }
    .pf-wallet-main:hover .pf-wallet-fig { opacity: .72; }
    .pf-wallet-label { font-size: 12px; font-weight: 600; color: var(--text-3); }
    .pf-wallet-fig { display: flex; align-items: baseline; gap: 10px; min-width: 0; transition: opacity .15s; }
    .pf-wallet-num { font-size: 40px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.05; }
    .pf-wallet-go { color: var(--text-3); flex-shrink: 0; align-self: center; }
    .pf-wallet-coin { width: 22px; height: 22px; border-radius: 50%; background: #627EEA; color: #fff; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; }
    .pf-wallet-acts { display: flex; gap: 8px; }
    .pf-wallet-btn { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 18px;
      border-radius: 999px; white-space: nowrap; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-family: inherit; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: background .16s ease, color .16s ease, border-color .16s ease,
      box-shadow .16s ease, transform .12s ease; }
    .pf-wallet-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .pf-wallet-btn:hover { border-color: var(--text-3); background: var(--surface-2); }
    .pf-wallet-btn:active { transform: scale(.97); }
    .pf-wallet-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .pf-wallet-btn.primary { background: var(--text); color: #fff; border-color: var(--text);
      box-shadow: 0 1px 2px rgba(10, 11, 13, .16); }
    .pf-wallet-btn.primary:hover { background: #1B1D21; border-color: #1B1D21; box-shadow: 0 6px 18px rgba(10, 11, 13, .22); }
    /* 钱包资产面板：桌面居中面板，移动端全屏底部抽屉（自带隐藏态，避免首屏闪现） */
    .ap-overlay { position: fixed; inset: 0; z-index: 2400; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: rgba(10, 11, 13, .32); opacity: 0; visibility: hidden;
      transition: opacity .25s ease, visibility .25s ease; }
    .ap-overlay.active { opacity: 1; visibility: visible; }
    .ap-panel { width: 100%; max-width: 560px; max-height: min(80vh, 720px); background: var(--surface);
      border-radius: 20px; padding: 18px 20px 8px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column;
      transform: translateY(10px) scale(.98); transition: transform .25s ease; }
    .ap-overlay.active .ap-panel { transform: none; }
    .ap-grip { display: none; }
    .ap-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding-bottom: 12px;
      border-bottom: 1px solid var(--border); }
    .ap-label { font-size: 12px; font-weight: 600; color: var(--text-3); }
    .ap-total { display: flex; align-items: baseline; gap: 10px; margin-top: 3px; }
    .ap-total strong { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
    .ap-head-acts { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .ap-head-btns { display: flex; gap: 8px; margin-top: 12px; }
    .ap-head-btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 16px;
      border-radius: 999px; white-space: nowrap; border: 1px solid var(--border); background: var(--surface);
      color: var(--text); font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
      transition: background .16s ease, color .16s ease, border-color .16s ease, box-shadow .16s ease, transform .12s ease; }
    .ap-head-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
    .ap-head-btn:hover { border-color: var(--text-3); background: var(--surface-2); }
    .ap-head-btn:active { transform: scale(.97); }
    .ap-head-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .ap-head-btn.primary { background: var(--text); color: #fff; border-color: var(--text);
      box-shadow: 0 1px 2px rgba(10, 11, 13, .16); }
    .ap-head-btn.primary:hover { background: #1B1D21; border-color: #1B1D21; box-shadow: 0 6px 18px rgba(10, 11, 13, .22); }
    .ap-close { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2);
      color: var(--text-2); cursor: pointer; font-size: 13px; line-height: 1; }
    .ap-close:hover { color: var(--text); border-color: var(--border-strong); }
    .ap-opt { display: flex; align-items: center; gap: 9px; padding: 10px 2px 8px; font-size: 12.5px;
      color: var(--text-2); cursor: pointer; user-select: none; flex-shrink: 0; }
    .ap-opt input { width: 16px; height: 16px; accent-color: var(--text); cursor: pointer; flex-shrink: 0; }
    .ap-opt:hover { color: var(--text); }
    .ap-body { overflow-y: auto; padding: 2px 0 12px; -webkit-overflow-scrolling: touch; }
    .ap-group { font-size: 11.5px; font-weight: 700; color: var(--text-3); padding: 12px 2px 6px; }
    .ap-row { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--border); }
    .ap-row:last-child { border-bottom: none; }
    .ap-ic { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--text);
      display: grid; place-items: center; font-size: 14px; font-weight: 800; flex-shrink: 0; }
    .ap-main { flex: 1; min-width: 0; }
    .ap-code { display: block; font-size: 14px; font-weight: 700; }
    .ap-name { display: block; font-size: 11.5px; color: var(--text-3); margin-top: 2px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
    .ap-bal { text-align: right; flex-shrink: 0; min-width: 96px; }
    .ap-bal b { display: block; font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .ap-bal span { display: block; font-size: 11.5px; color: var(--text-3); margin-top: 2px; font-variant-numeric: tabular-nums; }
    @media (max-width: 768px) {
      .ap-overlay { padding: 0; align-items: flex-end; }
      .ap-panel { max-width: none; max-height: 88vh; border-radius: 20px 20px 0 0; padding: 10px 16px 0; }
      .ap-grip { display: block; width: 36px; height: 4px; border-radius: 999px; background: var(--border-strong); margin: 4px auto 10px; }
      .ap-body { padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
      .ap-bal { min-width: 80px; }
      .ap-head-btns { width: 100%; }
      .ap-head-btn { flex: 1; }
    }

    /* 充值 / 提现面板：自带弹层基础样式与隐藏态（不依赖运行期注入，避免首屏闪现）
       显示类统一用 .active，与 auth.js / 其它页面的 auth-modal-overlay 约定一致 */
    #depositModal, #withdrawModal { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center;
      justify-content: center; padding: 24px; background: rgba(15, 23, 42, .4);
      -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
      opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility .3s ease; }
    #depositModal.active, #withdrawModal.active { opacity: 1; visibility: visible; }
    #depositModal .auth-modal, #withdrawModal .auth-modal { width: 100%; max-width: 420px; background: #fff;
      border-radius: 20px; padding: 22px; box-shadow: 0 20px 60px rgba(27, 45, 71, .2);
      transform: scale(.96) translateY(8px); transition: transform .3s ease; }
    #depositModal.active .auth-modal, #withdrawModal.active .auth-modal { transform: none; }
    .dp-qr { display: grid; place-items: center; margin: 4px 0 14px; }
    .dp-qr-frame { width: 168px; height: 168px; border-radius: 16px; border: 1px solid var(--border);
      background: var(--surface-2); padding: 10px; box-sizing: border-box; display: grid; place-items: center; }
    .dp-qr-frame svg { width: 100%; height: 100%; display: block; }
    .dp-qr-note { font-size: 11px; color: var(--text-3); margin-top: 8px; }
    .dp-asset { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; margin: 0 0 14px;
      border: 1px solid var(--border); border-radius: 14px; background: var(--surface); cursor: pointer;
      font-family: inherit; text-align: left; color: inherit; }
    .dp-asset:hover { border-color: var(--border-strong); }
    .dp-asset .ap-ic { width: 32px; height: 32px; }
    .dp-asset-switch { font-size: 11.5px; font-weight: 700; color: var(--text-3); flex-shrink: 0; }
    .dp-addr { display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin: 0 0 14px;
      border: 1px dashed var(--border-strong); border-radius: 14px; background: var(--surface-2); }
    .dp-addr code { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; word-break: break-all; line-height: 1.5; }
    .wm-field { display: grid; gap: 6px; margin-top: 12px; }
    .wm-field label { font-size: 12px; font-weight: 600; color: var(--text-3); }
    .wm-amt-row { display: flex; gap: 8px; align-items: center; }
    .wm-amt-row .input { flex: 1; min-width: 0; }
    .wm-max { height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text-2); font-family: inherit; font-size: 12px; font-weight: 700;
      cursor: pointer; flex-shrink: 0; }
    .wm-max:hover { color: var(--text); border-color: var(--border-strong); }
    .wm-err { display: none; color: var(--down); font-size: 12px; margin-top: 6px; }
    .wm-err.show { display: block; }
    .wm-review { display: grid; gap: 7px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); }
    .wm-row { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--text-2); }
    .wm-row b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }

    @media (max-width: 560px) {
      .pf-hero { padding: 16px; }
      .pf-wallet { flex-direction: column; align-items: stretch; gap: 14px; }
      .pf-wallet-num { font-size: 34px; }
      .pf-wallet-acts { width: 100%; }
      .pf-wallet-btn { flex: 1; }
    }

    /* Portfolio：上=余额块，下=通栏大图（参考 .profile-portfolio-overview 单列 grid） */
    .pf-portfolio { border-radius: 22px; padding: 22px 24px; display: grid; gap: 20px; background: var(--surface); border: 1px solid var(--border); }
    .pf-balance { display: grid; justify-items: start; gap: 4px; }
    .pf-bal-label { font-size: 12px; color: var(--text-3); }
    .pf-bal-num { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
    .pf-bal-sub { font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
    .pf-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .pf-top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .pf-chart-price .pf-pnl-rng { font-size: 12px; font-weight: 600; color: var(--text-3); margin-left: 8px; }
    .pf-chart { display: block; }
    .pf-chart-price { font-size: 16px; font-weight: 800; }
    .pf-ranges { display: flex; gap: 4px; }
    .pf-ranges button { height: 28px; padding: 0 12px; border-radius: 999px; border: none; background: none; color: var(--text-2); font-size: 12px; font-weight: 700; cursor: pointer; }
    .pf-ranges button.on { background: var(--accent-soft); color: var(--text); }
    .pf-canvas { width: 100%; height: 260px; display: block; }

    @media (max-width: 760px) {
      .pf-hero { align-items: flex-start; }
      .pf-portfolio { padding: 18px 16px; }
      .pf-canvas { height: 200px; }
    }
  </style>
</head>

    <!-- 钱包资产面板：桌面居中面板 / 移动端全屏抽屉（分组 + 市值降序 + 每行充值/提现/领取） -->

    <!-- 充值：接收 ETH（收款地址 + 二维码 + 网络/到账说明） -->

                </g>

  <script>
    // ============================================================
    //  我的资产
    // ============================================================
    var tab = 'hold';
    // 访客模式：assets.html?address=0x… → 以该地址查看（数据为演示档案）
    var visitorAddr = (function () {
      try {
        var q = new URLSearchParams(location.search).get('address');
        return (q && /^0x[0-9a-fA-F]{40}$/.test(q)) ? q.toLowerCase() : '';
      } catch (e) { return ''; }
    })();
    var esc = function (s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    };

    function coinById(id) { return Launch.coinById(id); }
    function myHoldings() {
      var out = [];
      Object.keys(Launch.USER.holdings || {}).forEach(function (id) {
        var c = coinById(id); var h = Launch.USER.holdings[id];
        if (c && h && h.amount > 0) out.push({ coin: c, hold: h });
      });
      return out;
    }
    function myCreated() {
      return (Launch.USER.created || []).map(coinById).filter(Boolean);
    }
    function myAiVideos() {
      var out = [];
      try {
        var vids = JSON.parse(localStorage.getItem('storyfun_my_videos') || '[]');
        out = vids.filter(function (v) { return v.kind === 'ai'; });
      } catch (e) {}
      return out;
    }

    var pnlRange = '1d';
    var pfMaxUsd = 1;             // 图 Y 轴上限（美元）
    function fmtSignedUsd(n) {
      if (Math.abs(n) < 0.005) return '$0';
      return (n >= 0 ? '+' : '−') + Launch.fmtUsd(Math.abs(n));
    }
    function pnlSeries(r) {
      var n = r === '7d' ? 84 : r === '30d' ? 120 : 48;
      var seed = 12345;
      var id = (window.Launch && Launch.USER && Launch.USER.id) || 'demo';
      for (var i = 0; i < id.length; i++) seed = (seed * 31 + id.charCodeAt(i)) >>> 0;
      seed = (seed + { '1d': 11, '7d': 47, '30d': 101 }[r] * 977) >>> 0;
      var out = [], v = 0.5;
      for (var k = 0; k < n; k++) {
        seed = (seed * 9301 + 49297) % 233280;
        var drift = (out.length === 0) ? 0 : (pfPnlSign || 1) * 0.002;
        v = Math.max(0.05, Math.min(1, v + (seed / 233280 - 0.48) * 0.06 + drift));
        out.push(v);
      }
      return out;
    }
    function drawPnl() {
      var cv = document.getElementById('pfChart');
      if (!cv || !cv.getContext) return;
      var dpr = window.devicePixelRatio || 1;
      var w = cv.clientWidth || 560, h = cv.clientHeight || 260;
      cv.width = w * dpr; cv.height = h * dpr;
      var ctx = cv.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, w, h);
      var s = pnlSeries(pnlRange);
      var padL = 40, padR = 10, padT = 12, padB = 8;
      var iw = w - padL - padR, ih = h - padT - padB;
      // 网格 4 线 + Y 轴美元刻度
      ctx.font = '10px ui-monospace, monospace';
      ctx.fillStyle = '#B9BEC4';
      ctx.strokeStyle = '#F0F1F3'; ctx.lineWidth = 1;
      for (var g = 0; g < 4; g++) {
        var gy = padT + (ih / 3) * g;
        ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(w - padR, gy); ctx.stroke();
        var usd = pfMaxUsd * (1 - g / 3);
        ctx.textAlign = 'left';
        ctx.fillText(fmtCompactUsd(usd), 2, gy + 3);
      }
      var x0 = padL, y0 = padT + ih;
      var px = function (i) { return x0 + (iw / (s.length - 1)) * i; };
      var py = function (v) { return y0 - v * ih; };
      // 渐变面积
      var gr = ctx.createLinearGradient(0, 0, 0, h);
      gr.addColorStop(0, 'rgba(10,11,13,0.12)');
      gr.addColorStop(1, 'rgba(10,11,13,0)');
      ctx.beginPath(); ctx.moveTo(px(0), py(s[0]));
      for (var i2 = 1; i2 < s.length; i2++) ctx.lineTo(px(i2), py(s[i2]));
      ctx.lineTo(px(s.length - 1), y0); ctx.lineTo(px(0), y0); ctx.closePath();
      ctx.fillStyle = gr; ctx.fill();
      // 折线
      ctx.beginPath(); ctx.moveTo(px(0), py(s[0]));
      for (var i3 = 1; i3 < s.length; i3++) ctx.lineTo(px(i3), py(s[i3]));
      ctx.strokeStyle = '#0A0B0D'; ctx.lineWidth = 2; ctx.stroke();
      // 末点
      var ex = px(s.length - 1), ey = py(s[s.length - 1]);
      ctx.beginPath(); ctx.arc(ex, ey, 3.5, 0, Math.PI * 2); ctx.fillStyle = '#0A0B0D'; ctx.fill();
      ctx.beginPath(); ctx.arc(ex, ey, 7, 0, Math.PI * 2); ctx.fillStyle = 'rgba(10,11,13,0.15)'; ctx.fill();
    }
    function fmtCompactUsd(n) {
      if (n >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
      if (n >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'k';
      if (n >= 10) return '$' + Math.round(n);
      return '$' + n.toFixed(n >= 1 ? 2 : 4);
    }
    var pfPnlSign = 1;
    function renderSummary() {
      var holds = myHoldings();
      var made = myCreated();
      var totalValUsd = holds.reduce(function (s, h) { return s + h.hold.amount * h.coin.priceUsd; }, 0);
      var costUsd = holds.reduce(function (s, h) { return s + h.hold.amount * h.hold.avgUsd; }, 0);
      var unrealized = totalValUsd - costUsd;
      var realized = Launch.USER.realizedPnl || 0;
      var totalPnl = unrealized + realized;
      pfPnlSign = totalPnl >= 0 ? 1 : -1;
      pfMaxUsd = Math.max(totalValUsd, totalPnl, 1);
      // 身份
      var av = document.getElementById('pfAvatar');
      var cu = (typeof currentUser !== 'undefined' && currentUser) ? currentUser : null;
      var bar = document.getElementById('pfVisitBar');
      if (bar) bar.style.display = visitorAddr ? '' : 'none';
      function fullAddr() {
        // 单一地址来源：auth.js 的 currentWallet（同账号全站同一串）
        if (window.currentWallet && typeof window.currentWallet.address === 'function') return window.currentWallet.address();
        var uid = (window.Launch && Launch.USER && Launch.USER.id) ? Launch.USER.id : 'demo';
        var seedStr = 'user:' + uid, h = 2166136261, i2;
        for (i2 = 0; i2 < seedStr.length; i2++) { h ^= seedStr.charCodeAt(i2); h = Math.imul(h, 16777619) >>> 0; }
        var hex = '';
        for (i2 = 0; i2 < 40; i2++) { h = Math.imul(h ^ (h >>> 13), 2654435761) >>> 0; hex += '0123456789abcdef'.charAt(h & 15); }
        return '0x' + hex;
      }
      var displayAddr = visitorAddr || fullAddr();
      if (visitorAddr) {
        av.innerHTML = '';
        av.textContent = String(displayAddr.charAt(2) || '?').toUpperCase();
      } else if (cu && cu.avatar) {
        av.innerHTML = '<img src="' + esc(cu.avatar) + '" alt="">';
      } else {
        av.textContent = '?';
      }
      var plink = document.getElementById('pfProfileLink');
      if (plink) plink.style.display = visitorAddr ? 'none' : '';
      var addrEl = document.getElementById('pfAddr');
      addrEl.textContent = displayAddr.slice(0, 6) + '…' + displayAddr.slice(-4);
      addrEl.dataset.full = displayAddr;
      addrEl.title = displayAddr;
      // Portfolio
      document.getElementById('pfBal').textContent = Launch.fmtUsd(totalValUsd);
      // pons：Across N open pons position(s)
      document.getElementById('pfBalSub').textContent =
        'Across ' + holds.length + ' open pons position' + (holds.length === 1 ? '' : 's');
      var rl = { '1d': '1d', '7d': '7d', '30d': '30d' }[pnlRange] || '1d';
      document.getElementById('pfPnlHead').innerHTML = fmtSignedUsd(totalPnl) + '<span class="pf-pnl-rng">PnL · ' + rl + '</span>';
      drawPnl();
      renderWallet();
    }

    // ============================================================
    //  钱包条：ETH 余额
    //  口径：钱包资产与 Portfolio（Σ持仓市值）分开统计

    function ethBal() {

    // 钱包条 / 资产面板：Σ 计价资产 USD + 资产数（多资产口径，与 Portfolio 持仓市值分开）

    // ============================================================
    //  钱包资产面板（桌面居中面板 / 移动端全屏抽屉）

    // ============================================================
    var AP_DUST_USD = 1;         // 灰尘阈值：美元估值低于该值的资产默认隐藏
    var apHideDust = true;       // 「隐藏 $1 以下资产」勾选状态（默认勾选）

    }
    function apSortedRows() {
      var out = [];
      apGroups().forEach(function (grp) {
        var rows = grp.rows.map(function (sym) {
          var q = assetBal(sym);
          return { sym: sym, qty: q, usd: assetUsd(sym, q) };
        }).filter(function (r) {
          return apHideDust ? r.usd >= AP_DUST_USD : true;
        }).sort(function (a, b) { return b.usd - a.usd; });
        if (rows.length) out.push({ g: grp.g, rows: rows });
      });
      return out;

    function apRowHtml(r) {

    function renderAssetPanel() {

          '<div class="empty-desc">' + (apHideDust ? '已隐藏 $1 以下的资产，取消勾选可查看全部' : '当前钱包暂无计价资产') + '</div></div>';

    // ============================================================
    //  充值 / 提现（任意计价资产；提现含签名确认与两段上链状态）

    // ============================================================
    var WD_GAS_RESERVE = 0.002;              // 提现需预留的网络费（ETH）
    var depSym = 'ETH';                      // 充值当前资产
    var wdSym = 'ETH';                       // 提现当前资产
    function walletGuard() {
      if (visitorAddr) { Launch.toast('访客视图不可操作', 'warn'); return false; }

    // ---- 资产选择器（充提弹层内切换资产） ----
    function openAssetPicker(target, cb) {
      var el = document.getElementById('assetPicker');

    // ---- 充值（接收资产） ----
    function depRender() {
      var sym = depSym;
      var native = (sym === 'ETH');
      var contract = (window.Launch && Launch.assetContract) ? Launch.assetContract(sym) : '';
      document.getElementById('depAsset').textContent = sym;
      document.getElementById('depAssetName').textContent = (window.Launch && Launch.assetName) ? Launch.assetName(sym) : sym;

        : '仅支持 Robinhood Chain 上的 ' + sym + '（上方合约地址），转入其它网络或其它代币将无法找回；到账以链上确认为准。';

    function closeDeposit() {

    // ---- 提现（转到外部地址） ----
    function wdErr(msg) {
      var e = document.getElementById('wdErr');
      if (!e) return;
      e.textContent = msg || '';
      e.classList.toggle('show', !!msg);
    }
    function wdValid() {
      var addr = (document.getElementById('wdAddr').value || '').trim();
      var raw = document.getElementById('wdAmt').value;
      var amt = parseFloat(raw);
      var bal = assetBal(wdSym);
      var own = (walletAddr() || '').toLowerCase();
      if (!/^0x[0-9a-fA-F]{40}$/.test(addr)) return { ok: false, msg: addr ? '请输入完整的 0x 地址（40 位十六进制）' : '' };
      if (/^0x0{40}$/i.test(addr)) return { ok: false, msg: '不能提现到零地址' };
      if (addr.toLowerCase() === own) return { ok: false, msg: '不能提现到当前钱包地址' };
      if (!(amt > 0)) return { ok: false, msg: raw ? '请输入大于 0 的金额' : '' };
      // 网络费（gas）固定消耗 ETH：非 ETH 资产也需持有足够 ETH
      var gasOk = ethBal() >= WD_GAS_RESERVE;
      if (!gasOk) return { ok: false, msg: 'ETH 余额不足，需预留网络费约 ' + WD_GAS_RESERVE + ' ETH' };
      var limit = (wdSym === 'ETH') ? (bal - WD_GAS_RESERVE) : bal;
      if (amt > limit) {
        return { ok: false, msg: (wdSym === 'ETH')
          ? ('超出可用余额，需预留网络费约 ' + WD_GAS_RESERVE + ' ETH')
          : ('超出 ' + wdSym + ' 可用余额') };
      }
      return { ok: true, addr: addr, amt: amt };
    }
    var wdBusy = false;
    function syncWd() {
      var r = wdValid();

      document.getElementById('wdAssetName').textContent = (window.Launch && Launch.assetName) ? Launch.assetName(wdSym) : wdSym;
      document.getElementById('wdIcon').textContent = (window.Launch && Launch.assetIcon) ? Launch.assetIcon(wdSym) : '$';
      document.getElementById('wdAvail').textContent = fmtAsset(wdSym, assetBal(wdSym));
      document.getElementById('wdFee').textContent = '≈ ' + fmtEth(WD_GAS_RESERVE) + '（ETH）';
      document.getElementById('wdRecv').textContent = fmtAsset(wdSym, raw > 0 ? raw : 0);

    function copyText(t, okMsg) {
      if (!t) { Launch.toast('暂无可复制的地址', 'warn'); return; }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(t).then(function () { Launch.toast(okMsg, 'ok'); },
            function () { Launch.toast('复制失败，请手动选择地址复制', 'warn'); });
          return;
        }
      } catch (e) {}
      Launch.toast('当前环境不支持自动复制，请手动选择地址复制', 'warn');
    }
    // 持有人分红（与币详情页同口径的确定性演示值）
    function divClaimed(id) {
      try { var a = JSON.parse(localStorage.getItem('sf_div_claimed') || '[]'); return a.indexOf(id) !== -1; } catch (e) { return false; }
    }
    function assetsDivAmt(id) {
      var h6 = 0, i6 = 0, ss2 = id || 'x';
      for (i6 = 0; i6 < ss2.length; i6++) h6 = (h6 * 31 + ss2.charCodeAt(i6)) >>> 0;
      var r6 = function (x) { return Math.round(x * 1e6) / 1e6; };
      var earned = r6(1.2 + (h6 % 48000) / 1000);
      var pot = r6(earned * (0.05 + ((h6 >>> 9) % 15) / 100));
      return r6(pot * (0.15 + ((h6 >>> 13) % 25) / 100));
    }
    function claimDiv(id) {
      var amt = assetsDivAmt(id);
      if (!amt) { Launch.toast('当前无待领分红', 'warn'); return; }
      // 分红按该币配对资产入账（与币详情页一致）
      var c = (Launch.coinById && Launch.coinById(id)) || null;
      var pair = (c && c.pair) || 'ETH';
      if (Launch.qtyOfUsd && Launch.credit) {
        Launch.credit(pair, Launch.qtyOfUsd(amt, pair));
        if (Launch.persist) Launch.persist();
      } else {
        Launch.USER.eth += Launch.usdToEth(amt);
        Launch.persist();
      }
      try { var a = JSON.parse(localStorage.getItem('sf_div_claimed') || '[]'); if (a.indexOf(id) === -1) { a.push(id); localStorage.setItem('sf_div_claimed', JSON.stringify(a)); } } catch (e) {}
      Launch.toast('已领取分红 ' + Launch.fmtQty(Launch.qtyOfUsd ? Launch.qtyOfUsd(amt, pair) : Launch.usdToEth(amt)) + ' ' + pair, 'ok');
      renderHold();
    }
    // ===== Holder dividends（pons：Holder dividends ready + Claim all） =====
    function divDemoMode() {
      var v = '';
      try { v = localStorage.getItem('sf_div_demo') || ''; } catch (e) {}
      return (v === 'ready' || v === 'claimed' || v === 'none') ? v : '';
    }
    function divResolved(c) {
      var m = divDemoMode();
      if (m === 'ready') return { ready: true, amount: assetsDivAmt(c.id), claimed: false };
      if (m === 'claimed') return { ready: false, claimed: true, amount: assetsDivAmt(c.id) };
      if (m === 'none') return { ready: false, claimed: false, amount: 0 };
      if (c.shareToHolders && !divClaimed(c.id)) return { ready: true, amount: assetsDivAmt(c.id), claimed: false };
      return { ready: false, claimed: !!c.shareToHolders, amount: assetsDivAmt(c.id) };
    }
    var DIV_DEMO_LABEL = { ready: '分红演示: 待领取', claimed: '分红演示: 已领取', none: '分红演示: 无', '': '分红演示: 自动' };
    function divDemoLabel() { return DIV_DEMO_LABEL[divDemoMode()] || '分红演示: 自动'; }
    function cycleDivDemo() {
      var seq = ['', 'ready', 'claimed', 'none'];
      var m = divDemoMode();
      var nx = seq[(seq.indexOf(m) + 1) % seq.length];
      try { if (nx) localStorage.setItem('sf_div_demo', nx); else localStorage.removeItem('sf_div_demo'); } catch (e) {}
      renderHold();
      syncDivBanner();
    }
    function divReadyList() {
      return myHoldings().filter(function (h) { return divResolved(h.coin).ready; });
    }
    function markDivClaimedId(id) {
      try {
        var arr = JSON.parse(localStorage.getItem('sf_div_claimed') || '[]');
        if (arr.indexOf(id) === -1) { arr.push(id); localStorage.setItem('sf_div_claimed', JSON.stringify(arr)); }
      } catch (e) {}
    }
    function syncDivBanner() {
      var banner = document.getElementById('divBanner');
      if (!banner) return;
      var list = divReadyList();
      var tot = 0;
      list.forEach(function (h) { tot += assetsDivAmt(h.coin.id); });
      var show = !visitorAddr && list.length > 0 && tot > 0;
      banner.style.display = show ? 'flex' : 'none';
      if (show) {
        document.getElementById('divDesc').textContent =
          Launch.fmtUsd(tot) + ' ready across ' + list.length + ' coin' + (list.length === 1 ? '' : 's');
      }
    }
    function claimAllDivs() {
      if (visitorAddr) { Launch.toast('访客视图不可领取', 'warn'); return; }
      var list = divReadyList();
      if (!list.length) { Launch.toast('暂无可领取分红', 'warn'); return; }
      if (divDemoMode() === 'ready') {
        try { localStorage.setItem('sf_div_demo', 'claimed'); } catch (e) {}
        Launch.toast('演示：已领取持有人分红', 'ok');
      } else {
        var done = 0, tot = 0;
        list.forEach(function (h) {
          var id = h.coin.id, amt = assetsDivAmt(id);
          if (!amt) return;
          var pair = h.coin.pair || 'ETH';
          if (Launch.credit && Launch.qtyOfUsd) Launch.credit(pair, Launch.qtyOfUsd(amt, pair));
          else Launch.USER.eth += Launch.usdToEth(amt);
          markDivClaimedId(id);
          done++; tot += amt;
        });
        if (Launch.persist) Launch.persist();
        Launch.toast(done ? ('已领取持有人分红 ' + Launch.fmtUsd(tot)) : '暂无可领取分红', done ? 'ok' : 'warn');
      }
      renderSummary();
      render();

    function renderHold() {
      var holds = myHoldings();
      var host = document.getElementById('asBody');
      if (!holds.length) {
        host.innerHTML = '<div class="empty"><div class="empty-icon">◎</div><div class="empty-title">还没有持仓</div><div class="empty-desc">发现一个叙事，从第一笔开始</div><button class="btn btn-primary" onclick="location.href=\'launchpad.html\'">去市场看看</button></div>';

        // Entry mcap = 建仓均价对应的市值（等价于均价 × 总流通）
        var entryMcap = (c.marketCap || 0) * (h.hold.avgUsd / Math.max(c.priceUsd, 1e-12));
        var curMcap = c.marketCap || 0;
        var up = pnl >= 0;

            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>' +
          '</button></div>' +
        '</div>';
      }).join('');
      var head = '<div class="pos-head pos-head-row"><div>' +
        '<div class="pos-title">Open positions</div>' +
        '<div class="pos-sub">Entry, current market cap, value, and PnL.</div></div>' +
        (isDebug() ? '<button type="button" class="fee-demo-btn" onclick="cycleDivDemo()" title="切换持有人分红演示状态">' + divDemoLabel() + '</button>' : '') + '</div>';
      host.innerHTML = head + '<div class="pos-scroll"><div class="pos-list">' + rows + '</div></div>';
      syncDivBanner();
    }

    // 分享：弹出“看起来像图片”的 HTML 分享卡（含持仓信息，不真实生成文件）
    function fmtMc(n) {
      if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
      return '$' + n.toFixed(2);
    }

      if (e.target === this) closeShare();
    });

    // Open 持仓行 meta：$SYM · time ago · N trades（本轮，自上次完整退出起）
    function posMeta(c) {
      var lastExit = 0;
      (Launch.USER.closed || []).forEach(function (r) { if (r.coinId === c.id && (r.exitAt || 0) > lastExit) lastExit = r.exitAt; });
      var nb = 0, ns = 0, lastAt = 0;
      (Launch.USER.tx || []).forEach(function (t) {
        if (t.coinId !== c.id || (t.at || 0) <= lastExit) return;
        if (t.side === 'buy') nb++; else if (t.side === 'sell') ns++;
        if ((t.at || 0) > lastAt) lastAt = t.at || 0;
      });
      var ago = lastAt ? ' \u00b7 ' + Launch.timeAgo(lastAt) + ' ago' : '';
      return ago + ' \u00b7 ' + (nb + ns) + ' trades';
    }

    function actHead() { return '<div class="pos-head"><div class="pos-title">Activity</div><div class="pos-sub">Recent buys and sells across pons pools.</div></div>'; }

    // ===== Creator fees（pons：Ready/Claimed/Open + 横幅；含演示状态切换） =====
    function demoFeeMode() {
      var v = '';
      try { v = localStorage.getItem('sf_fee_demo') || ''; } catch (e) {}
      return (v === 'ready' || v === 'claimed' || v === 'open') ? v : '';
    }
    function simFeeAmt(c) {
      var h = 0, str = c.id || 'x';
      for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
      return Math.round((1.2 + (h % 48000) / 1000) * 100) / 100;
    }
    function feeResolved(c) {
      var m = demoFeeMode();
      if (m === 'ready') return { claimable: simFeeAmt(c), claimed: 0 };
      if (m === 'claimed') return { claimable: 0, claimed: simFeeAmt(c) };
      if (m === 'open') return { claimable: 0, claimed: 0 };
      return { claimable: Launch.USER.claimable[c.id] || 0, claimed: Launch.USER.claimed[c.id] || 0 };
    }
    var FEE_DEMO_LABEL = { ready: '演示: 待领取', claimed: '演示: 已领取', open: '演示: 无收益', '': '演示: 自动' };
    function demoFeeLabel() { return FEE_DEMO_LABEL[demoFeeMode()] || '演示: 自动'; }
    function cycleFeeDemo() {
      var seq = ['', 'ready', 'claimed', 'open'];
      var m = demoFeeMode();
      var nx = seq[(seq.indexOf(m) + 1) % seq.length];
      try { if (nx) localStorage.setItem('sf_fee_demo', nx); else localStorage.removeItem('sf_fee_demo'); } catch (e) {}
      renderMade();
      syncFeesBanner();
    }
    function syncFeesBanner() {
      var banner = document.getElementById('feesBanner');
      if (!banner) return;
      var made = myCreated();
      var tot = 0, cnt = 0;
      made.forEach(function (c) { var fs = feeResolved(c); if (fs.claimable > 0) { tot += fs.claimable; cnt++; } });
      var show = !visitorAddr && made.length > 0 && tot > 0;
      banner.style.display = show ? 'flex' : 'none';
      if (show) {
        document.getElementById('fbDesc').textContent =
          Launch.fmtUsd(tot) + ' claimable across ' + cnt + ' launch' + (cnt === 1 ? '' : 'es');
      }
    }
    function claimFees() {
      if (visitorAddr) { Launch.toast('访客视图不可领取', 'warn'); return; }
      var made = myCreated();
      var ids = made.filter(function (c) { return feeResolved(c).claimable > 0; }).map(function (c) { return c.id; });
      if (!ids.length) { Launch.toast('暂无可领取收益', 'warn'); return; }
      if (demoFeeMode() === 'ready') {
        Launch.toast('演示：已领取 Creator fees', 'ok');
        try { localStorage.setItem('sf_fee_demo', 'claimed'); } catch (e) {}
      } else {
        var done = 0, usd = 0;
        ids.forEach(function (id) { var r = Launch.claim(id); if (r && r.ok) { done++; usd += r.usd; } });
        Launch.toast(done ? ('已领取 ' + Launch.fmtUsd(usd)) : '暂无可领取收益', done ? 'ok' : 'warn');
      }
      renderSummary();
      render();
    }

          '<span class="pl-logo">' + logo + '</span>' +
          '<span class="pl-copy"><strong>' + esc(c.name) + '</strong>' +
            '<small>$' + esc(c.symbol) + ' \u00b7 ' + (c.graduated ? 'Graduated' : 'curve') + ' \u00b7 ' + Launch.fmtUsd(c.marketCap || 0) + '</small></span>' +
          '<span class="pl-status">' + status + '</span>' +
        '</div>';
      }).join('');
      host.innerHTML = head + '<div class="pl-list">' + rows + '</div>';
      syncFeesBanner();
    }

    function renderTx() {
      var txs = Launch.USER.tx || [];
      var host = document.getElementById('asBody');
      var head = actHead();
      if (!txs.length) {
        host.innerHTML = head + '<div class="empty"><div class="empty-icon">⇅</div>' +
          '<div class="empty-title">No trades found in the recent lookback window.</div>' +
          '<div class="empty-desc">买入第一笔后，成交流会显示在这里</div>' +
          '<button class="btn btn-primary" onclick="location.href=\'launchpad.html\'">去市场看看</button></div>';
        return;
      }
      var rows = txs.slice(0, 40).map(function (t) {
        var c = coinById(t.coinId);
        var sym = (c && c.symbol) || t.symbol || '';
        var name = (c && c.name) || t.symbol || '—';
        var logo = c && c.cover
          ? '<img src="' + esc(c.cover) + '" alt="" loading="lazy">'
          : esc((sym || '?').charAt(0).toUpperCase());
        var side = t.side === 'sell' ? 'sell' : 'buy';
        var word = side === 'buy' ? 'Bought' : 'Sold';
        var amtTxt = fmtPonsAmt(t.amount);
        var ago = (t.at ? Launch.timeAgo(t.at) + ' ago' : '—');
        return '<div class="pl-row is-' + side + '" onclick="goCoin(\'' + esc(t.coinId || '') + '\')">' +
          '<span class="pl-logo">' + logo + '</span>' +
          '<span class="pl-copy">' +
            '<strong><span class="ac-word ' + side + '">' + word + '</span> ' + amtTxt + ' <small style="display:inline;font-size:inherit">$' + esc(sym) + '</small></strong>' +
            '<small>' + esc(name) + ' \u00b7 ' + Launch.fmtUsd(t.netUsd || t.grossUsd || 0) + '</small>' +
          '</span>' +
          '<time class="act-time">' + ago + '</time>' +
        '</div>';
      }).join('');
      host.innerHTML = head + '<div class="pl-list">' + rows + '</div>';
    }

    function renderAi() {
      var vids = myAiVideos();
      var host = document.getElementById('asBody');
      if (!vids.length) {
        host.innerHTML = '<div class="empty"><div class="empty-icon">✦</div><div class="empty-title">还没有 AI 叙事</div><div class="empty-desc">在创建流程中用 AI 生成，视频会自动保存在这里</div><button class="btn btn-primary" onclick="location.href=\'launch.html\'">去生成</button></div>';
        return;
      }
      host.innerHTML = '<div class="asset-grid">' + vids.map(function (v, i) {
        var coined = !!v.coinId;
        return '<div class="card ai-card">' +
          '<div class="ai-thumb" onclick="playAi(' + i + ')">' +
            (v.video ? '<video src="' + esc(v.video) + '" muted playsinline></video>' : '<img src="' + esc(v.cover || 'image/hero-bg-blur.jpg') + '" alt="">') +
            '<div class="pb"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div></div>' +
          '<div class="asset-body">' +
            '<div class="asset-name">' + esc(v.title || '未命名叙事') + '</div>' +
            '<div class="asset-sub">' + (coined ? '🎬 已发币 · ' : '') + 'AI 生成 · 15s · ' + esc(v.desc || '').slice(0, 24) + '</div>' +
          '</div>' +
          (coined && v.coinId
            ? '<button class="asset-btn ghost" onclick="goCoin(\'' + esc(v.coinId) + '\')">发币详情</button>'
            : '<button class="asset-btn" onclick="reuse(' + i + ')">用它发币</button>') +
          '</div>';
      }).join('') + '</div>';
      window._aiVids = vids;
    }

    // pons 金额/币量缩写（小写 k）
    function fmtPonsAmt(n) {
      if (n == null || isNaN(n)) return '—';
      if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(2) + 'k';
      if (n >= 1) return n.toFixed(2);
      return Number(n).toPrecision(3);
    }
    function fmtAmt(n) {
      if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
      return Math.floor(n) + '';
    }
    function goCoin(id) { location.href = 'coin-detail.html?id=' + encodeURIComponent(id); }
    function playAi(i) {
      var v = window._aiVids[i];
      if (!v || !v.video) { Launch.toast('该叙事暂无视频', 'warn'); return; }
      document.getElementById('playVideo').src = v.video;
      document.getElementById('playModal').classList.add('open');
      document.body.style.overflow = 'hidden';
      setTimeout(function () { document.getElementById('playVideo').play().catch(function () {}); }, 120);
    }
    function reuse(i) {
      var v = window._aiVids[i];
      if (!v) return;
      location.href = 'launch.html?reuse=' + encodeURIComponent(JSON.stringify(v));
    }
    document.getElementById('playModal').addEventListener('click', function (e) {
      if (e.target === this) { this.classList.remove('open'); document.getElementById('playVideo').pause(); document.body.style.overflow = ''; }
    });

    function doClaim(id) {
      if (!Launch.isLoggedIn()) { openLoginModal(); return; }
      var r = Launch.claim(id);
      if (r.ok) {
        Launch.toast('已领取 ' + Launch.fmtUsd(r.usd), 'ok');
        renderSummary();
        renderMade();
      } else {
        Launch.toast(r.msg || '暂无可领取收益', 'warn');
      }
    }

    function render() {
      var logged = Launch.isLoggedIn();
      document.getElementById('needLogin').style.display = logged ? 'none' : 'block';
      document.getElementById('asBody').style.display = logged ? '' : 'none';
      document.getElementById('pfHero').style.display = logged ? '' : 'none';
      document.getElementById('walletStrip').style.display = logged ? '' : 'none';
      document.getElementById('pfPortfolio').style.display = logged ? '' : 'none';
      if (!logged) {
        var fbN = document.getElementById('feesBanner');
        if (fbN) fbN.style.display = 'none';
        var dbN = document.getElementById('divBanner');
        if (dbN) dbN.style.display = 'none';
        return;
      }
      renderSummary();
      if (tab === 'hold') renderHold();
      else if (tab === 'closed') renderClosed();
      else if (tab === 'made') renderMade();
      else if (tab === 'tx') renderTx();
      syncFeesBanner();
      syncDivBanner();
      syncTabCounts();
    }

    window.onLaunchShellReady = function () {
      // PnL 范围切换
      document.getElementById('pfRanges').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-r]');
        if (!b) return;
        pnlRange = b.getAttribute('data-r');
        document.querySelectorAll('#pfRanges button').forEach(function (x) { x.classList.toggle('on', x === b); });
        renderSummary();
      });
      window.addEventListener('resize', function () { drawPnl(); });
      // 复制地址
      document.getElementById('pfCopy').addEventListener('click', function () {
        copyText(walletAddr(), '地址已复制');
      });
      // 钱包入口：桌面钱包条总额 / 移动端胶囊 → 资产面板
      document.getElementById('walletEntry').addEventListener('click', openAssetPanel);
      document.getElementById('apTopup').addEventListener('click', function () { openDeposit('ETH'); });
      document.getElementById('apWithdraw').addEventListener('click', function () { openWithdraw('ETH'); });
      // 列表选项：隐藏 $1 以下资产（默认勾选）
      document.getElementById('apHideDust').addEventListener('change', function () {
        apHideDust = !!this.checked;
        renderWallet();
        renderAssetPanel();
      });
      // 钱包条行内充提：默认 ETH，弹层内可切换资产
      document.getElementById('topupBtn').addEventListener('click', function () { openDeposit('ETH'); });
      document.getElementById('withdrawBtn').addEventListener('click', function () { openWithdraw('ETH'); });
      document.getElementById('depAssetBtn').addEventListener('click', function () {
        openAssetPicker('deposit', function (sym) { depSym = sym; depRender(); });
      });
      document.getElementById('wdAssetBtn').addEventListener('click', function () {
        openAssetPicker('withdraw', function (sym) { wdSym = sym; syncWd(); });
      });
      document.getElementById('depCopy').addEventListener('click', function () {
        copyText(walletAddr(), '收款地址已复制');
      });
      document.getElementById('depCopyContract').addEventListener('click', function () {
        var c = (window.Launch && Launch.assetContract) ? Launch.assetContract(depSym) : '';
        copyText(c, '合约地址已复制');
      });
      ['wdAddr', 'wdAmt'].forEach(function (id) {
        document.getElementById(id).addEventListener('input', syncWd);
      });
      document.getElementById('wdMax').addEventListener('click', function () {
        var reserve = (wdSym === 'ETH') ? WD_GAS_RESERVE : 0;
        var max = Math.max(0, assetBal(wdSym) - reserve);
        document.getElementById('wdAmt').value = String(Math.round(max * 1e6) / 1e6);
        syncWd();
      });
      document.getElementById('wdSubmit').addEventListener('click', submitWd);
      // Tab
      document.querySelectorAll('.as-tab').forEach(function (b) {
        b.addEventListener('click', function () {
          tab = b.getAttribute('data-t');
          document.querySelectorAll('.as-tab').forEach(function (x) { x.classList.remove('on'); });
          b.classList.add('on');
          render();
        });
      });
      // Creator fees Claim
      var fcb = document.getElementById('fbClaim');
      if (fcb) fcb.addEventListener('click', claimFees);
      // Holder dividends Claim all
      var dcb = document.getElementById('divClaim');
      if (dcb) dcb.addEventListener('click', claimAllDivs);
      // 登录状态变化重新渲染
      window.addEventListener('auth-ready', function () { render(); });
      render();
      syncFeesBanner();
      syncDivBanner();
    };
  </script>
  <script src="load-desktop-header.js"></script>
  <script src="load-sidebar.js"></script>
  <script src="load-bottom-nav.js"></script>
</body>
</html>
